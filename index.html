// ================================================================ эффекты интерфейса
function flyRewards(from, rew) {
  const fr = (from.getBoundingClientRect ? from.getBoundingClientRect() : from);
  const fx = $('fx');
  Object.entries(rew).filter(([, v]) => v > 0).forEach(([k, v], i) => {
    const target = $('rv_' + k) || $('resbar');
    const tr = target.getBoundingClientRect();
    for (let n = 0; n < 5; n++) {
      const el = document.createElement('div');
      el.className = 'fly';
      el.innerHTML = resIcon(k) + (n === 0 ? `+${fmt(v)}` : '');
      fx.appendChild(el);
      const sx = fr.left + fr.width / 2 - 13 + (Math.random() - .5) * 40, sy = fr.top + fr.height / 2 - 13 + (Math.random() - .5) * 20;
      const ex = tr.left + tr.width / 2 - 13, ey = tr.top + tr.height / 2 - 13;
      const mx = (sx + ex) / 2 + (Math.random() - .5) * 120, my = Math.min(sy, ey) - 60 - Math.random() * 60;
      const delay = i * 120 + n * 60, dur = 700 + Math.random() * 200;
      el.animate([
        { transform: `translate(${sx}px,${sy}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${sx}px,${sy - 20}px) scale(1.1)`, opacity: 1, offset: .15 },
        { transform: `translate(${mx}px,${my}px) scale(1)`, opacity: 1, offset: .55 },
        { transform: `translate(${ex}px,${ey}px) scale(.6)`, opacity: .9 }
      ], { duration: dur, delay, easing: 'cubic-bezier(.5,0,.5,1)', fill: 'both' }).onfinish = () => {
        el.remove();
        if (n === 4) { const b = target.closest('.res'); if (b) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
      };
    }
  });
}
function confetti(x, y) {
  if (x && x.getBoundingClientRect) { const r = x.getBoundingClientRect(); y = r.top + r.height / 2; x = r.left + r.width / 2; }
  const fx = $('fx'), colors = ['#FFB000', '#F28AB2', '#7FCBB0', '#A57FE0', '#FFE27A', '#E0505E'];
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.background = colors[i % colors.length];
    fx.appendChild(el);
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 160;
    const dx = Math.cos(a) * sp, dy = Math.sin(a) * sp - 120;
    el.animate([
      { transform: `translate(${x}px,${y}px) rotate(0)`, opacity: 1 },
      { transform: `translate(${x + dx}px,${y + dy}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .5 },
      { transform: `translate(${x + dx * 1.3}px,${y + dy + 260}px) rotate(${Math.random() * 900}deg)`, opacity: 0 }
    ], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => el.remove();
  }
}
function floater(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'floater'; el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px'; if (color) el.style.color = color;
  $('fx').appendChild(el); setTimeout(() => el.remove(), 1300);
}

// ================================================================ танец пчёл
/** Пока открыт полноэкранный танец, 3D под ним не рисуем: иначе на Android мерцают слои. */
function closeDance() {
  $('dance').classList.add('hidden');
  $('scene').style.visibility = '';
  if (view === 'hive') Scene3D.pause(false);
}
function openDance() {
  const el = $('dance'); el.classList.remove('hidden');
  Scene3D.pause(true);
  $('scene').style.visibility = 'hidden';
  const e = energyNow(), c = cfg(), buff = activeBuff();
  const canStart = !buff && e >= c.danceCost;
  el.innerHTML = `<h3>${T('dance_title')}</h3>
    <div class="stage demo"><div class="target"></div><div class="approach"></div><svg class="dbee" viewBox="0 0 64 64"><use href="#m-bee"/></svg></div>
    <p class="hint"><b>${L('Нажимайте, когда кольцо сожмётся до круга.', 'Tap when the ring shrinks onto the circle.')}</b><br>${L('10 нажатий. Чем точнее, тем больше бонус к сбору на 30 минут: от +20% до +40%.', '10 taps. The more precise, the bigger the 30-minute gathering bonus: +20% to +40%.')}</p>
    <div class="row" style="justify-content:center">${resIcon('energy')}<b class="num">${e} / ${c.energyMax}</b></div>
    <div class="small muted">${buff ? T('dance_active', Math.ceil((buff.until - now()) / 60000)) : e < c.danceCost ? T('dance_no_energy') : T('dance_cost', c.danceCost)}</div>
    <button class="btn primary big" id="danceGo" style="min-width:220px" ${canStart ? '' : 'disabled'}>${T('dance_start')}</button><button class="btn ghost" id="danceClose">${T('close')}</button>`;
  $('danceClose').onclick = closeDance;
  if (canStart) $('danceGo').onclick = runDance;
  Coach.onEvent('dance');
}
function runDance() {
  const el = $('dance');
  const BEAT = 950, N = 10, LEAD = 2200;
  el.innerHTML = `<div class="score" id="dScore">${L('Приготовьтесь…', 'Get ready…')}</div>
    <div class="stage" id="dStage"><div class="target" id="dTarget"></div><div class="approach" id="dRing"></div><svg class="dbee" id="dBee" viewBox="0 0 64 64"><use href="#m-bee"/></svg></div>
    <div class="beats" id="dBeats">${'<i></i>'.repeat(N)}</div>
    <p class="hint">${L('Нажимайте в любом месте экрана, когда кольцо совпадёт с кругом', 'Tap anywhere when the ring meets the circle')}</p>`;
  const t0 = performance.now() + LEAD, taps = [], judged = new Array(N).fill(null), dots = [...$('dBeats').children];
  const mark = (i, cls) => { judged[i] = cls; dots[i].className = cls; };
  const say = (text, color) => { const sc = $('dScore'); sc.textContent = text; sc.style.color = color; sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop'); };
  const onTap = (ev) => {
    ev.preventDefault();
    const tp = performance.now(); taps.push(tp);
    const k = Math.round((tp - t0) / BEAT), dd = Math.abs(tp - (t0 + k * BEAT));
    const b = $('dBee'); b.style.transform = `scale(1.15) rotate(${(Math.random() - .5) * 24}deg)`; setTimeout(() => { b.style.transform = ''; }, 120);
    haptic();
    if (k < 0 || k >= N || judged[k]) { if (tp > t0 - BEAT / 2) say(L('Рано', 'Too early'), '#C13515'); return; }
    if (dd < 110) { mark(k, 'perfect'); say(L('Идеально!', 'Perfect!'), '#1F7A3A'); $('dTarget').classList.remove('hit'); void $('dTarget').offsetWidth; $('dTarget').classList.add('hit'); }
    else if (dd < 240) { mark(k, 'good'); say(L('Хорошо', 'Good'), '#222'); }
    else { mark(k, 'miss'); say(tp < t0 + k * BEAT ? L('Рано', 'Too early') : L('Поздно', 'Too late'), '#C13515'); }
  };
  el.addEventListener('pointerdown', onTap);
  const frame = () => {
    const t = performance.now() - t0;
    const next = Math.max(0, Math.ceil(t / BEAT));           // ближайший будущий удар
    const ring = $('dRing');
    if (ring) {
      if (next < N) {
        const ph = 1 - (next * BEAT - t) / BEAT;             // 0 → 1 к моменту удара
        const vis = Math.max(0, Math.min(1, ph));
        ring.style.transform = `scale(${2.3 - 1.3 * vis})`; ring.style.opacity = t < -BEAT ? 0 : 0.25 + vis * 0.75;
      } else ring.style.opacity = 0;
    }
    for (let i = 0; i < N; i++) if (!judged[i] && t > i * BEAT + 300) { mark(i, 'miss'); say(L('Пропуск', 'Missed'), '#C13515'); }
    if (t < BEAT * (N - 1) + 500) requestAnimationFrame(frame); else finish();
  };
  requestAnimationFrame(frame);
  function finish() {
    el.removeEventListener('pointerdown', onTap);
    const used = new Set(); let sum = 0;
    for (let i = 0; i < N; i++) {
      const bt = t0 + i * BEAT; let best = -1, bd = 1e9;
      taps.forEach((tp, k) => { const dd = Math.abs(tp - bt); if (!used.has(k) && dd < bd) { bd = dd; best = k; } });
      if (best >= 0 && bd < 300) { used.add(best); sum += 1 - bd / 300; }
    }
    const extra = Math.max(0, taps.length - used.size) * 0.03;
    const acc = Math.max(0, Math.min(1, sum / N - extra));
    const r = doAction('dance', { accuracy: acc });
    const sc = $('dScore'); sc.style.color = '#222'; sc.textContent = `${T('accuracy')}: ${Math.round(acc * 100)}%`;
    el.querySelector('.hint').remove();
    el.insertAdjacentHTML('beforeend', r ? `<p class="score" style="color:#1F7A3A">${T('dance_result', Math.round(r.bonus * 100))}</p><button class="btn primary big" id="danceDone">${T('close')}</button>`
      : `<button class="btn big" id="danceDone">${T('close')}</button>`);
    if (r) { confetti(window.innerWidth / 2, window.innerHeight * .35); Scene3D.celebrate(1, 0, 'dance'); }
    $('danceDone').onclick = closeDance;
  }
}

// ================================================================ навигация
function setActiveTier(t) { clearSel(); activeTier = t; Scene3D.setTier(t); renderTiers(); }
async function setView(v) {
  closeSheet(); clearSel();
  view = v === 'map' ? 'map' : 'hive';
  if (view === 'map') {
    Scene3D.pause(true);
    MapView.show(true);
    $('mapCtl').classList.remove('hidden');
    if (!MAPDATA) { try { MAPDATA = JSON.parse(localStorage.getItem('mh_map') || 'null'); } catch (e) {} }
    if (MAPDATA) { Replica.setGrid(MAPDATA.grid); MapView.setData(MAPDATA, S, true); }
    serverAction('map', {}, { silent: !!MAPDATA }).then(md => {
      const first = !MAPDATA; MAPDATA = md; Replica.setGrid(md.grid);
      try { localStorage.setItem('mh_map', JSON.stringify(md)); } catch (e) {}
      if (view === 'map') MapView.setData(MAPDATA, S, first);
    }).catch(() => {});
  } else {
    MapView.show(false);
    $('mapCtl').classList.add('hidden');
    Scene3D.pause(false);
  }
  renderTiers(); renderBuildCard(); renderDance(); renderNavDots(); renderGoal();
  Coach.onEvent('view', view);
}
function onNav(k) {
  haptic();
  if (k === 'hive') { if (view !== 'hive') setView('hive'); else closeSheet(); return; }
  if (k === 'map') { if (view !== 'map') setView('map'); else closeSheet(); return; }
  if (view === 'map') setView('hive').then(() => openNavSheet(k)); else openNavSheet(k);
}
function openNavSheet(k) { if (k === 'bees') beesSheet(); if (k === 'quests') questsSheet(); if (k === 'swarms') swarmsSheet(); Coach.onEvent('nav', k); }

const weakDevice = (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
let QUALITY = localStorage.getItem('mh_quality') || (weakDevice ? 'mid' : 'high');
function setQuality(q) { QUALITY = q; localStorage.setItem('mh_quality', q); Scene3D.setQuality(q); }

// ================================================================ вход
let authTab = 'register', regColor = null, regChar = 'toiler';
async function showAuth() {
  $('loading').classList.add('hidden'); $('game').classList.add('hidden'); $('auth').classList.remove('hidden');
  applyStaticTexts();
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  renderAuth();
  try { const r = await publicCall('colors', {}); renderSwatches(r.colors); } catch (e) { renderSwatches([]); }
}
function renderAuth() {
  document.querySelectorAll('#authTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === authTab));
  $('regExtra').classList.toggle('hidden', authTab !== 'register');
  $('authSubmit').textContent = authTab === 'login' ? T('enter') : T('create');
  $('fPin').autocomplete = authTab === 'login' ? 'current-password' : 'new-password';
  $('chars').innerHTML = ['toiler', 'warrior', 'wanderer'].map(c => `<button type="button" class="char ${c === regChar ? 'on' : ''}" data-char="${c}"><b>${T('char_' + c)}</b><small>${T('char_' + c + '_d')}</small></button>`).join('');
}
function renderSwatches(colors) {
  if (!regColor) { const f = colors.find(c => c.free); regColor = f && f.color; }
  $('swatches').innerHTML = colors.map(c => `<button type="button" class="swatch ${c.color === regColor ? 'on' : ''}" style="background:${c.color}" data-color="${c.color}" ${c.free ? '' : 'disabled'} aria-label="${c.color}"></button>`).join('');
}
async function submitAuth(e) {
  e.preventDefault();
  const name = $('fName').value.trim(), pin = $('fPin').value.trim();
  const btn = $('authSubmit'); btn.disabled = true; const label = btn.textContent; btn.textContent = '…';
  try {
    const r = authTab === 'login' ? await publicCall('login', { name, pin })
      : await publicCall('register', { name, pin, color: regColor, character: regChar, telegram: $('fTg').value.trim(), lang: LANG });
    TOKEN = r.token; localStorage.setItem('mh_token', TOKEN);
    queue = []; localStorage.removeItem('mh_queue'); localStorage.removeItem('mh_snap');
    if (authTab === 'register') localStorage.removeItem('mh_coach');
    await startGame();
  } catch (err) { toast(err.code ? TE(err.code, err.params) : TE('NETWORK'), 'err'); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function logoutLocal() {
  TOKEN = ''; S = null; sceneSig = ''; queue = [];
  ['mh_token', 'mh_snap', 'mh_queue', 'mh_map'].forEach(k => localStorage.removeItem(k));
  MAPDATA = null; closeSheet(); authTab = 'login'; showAuth();
}

// ================================================================ запуск
let sceneReady = false, ticker = null;
async function startGame() {
  $('auth').classList.add('hidden');
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('mh_snap') || 'null'); queue = JSON.parse(localStorage.getItem('mh_queue') || '[]'); } catch (e) { queue = []; }
  if (!cached) { $('loading').classList.remove('hidden'); $('loadingText').textContent = T('loading_world'); }
  if (!sceneReady) {
    await Scene3D.init($('scene'), now, QUALITY);
    Scene3D.onCellTap = selectCell;
    Scene3D.onDropTap = (sp) => {
      const r = doAction('collectDrop');
      if (!r) { Scene3D.setDrops(S.drops.n); return; }
      flyRewards({ left: sp.x - 20, top: sp.y - 20, width: 40, height: 40 }, r.rew);
      floater(sp.x, sp.y - 10, `+${fmt(r.rew.honey)}`, '#B86E00');
      Coach.onEvent('drop');
    };
    Scene3D.onEmptyTap = clearSel;
    MapView.init($('mapCanvas'), now);
    MapView.onCellTap = (x, y) => { haptic(); mapCellSheet(x, y); };
    sceneReady = true;
  }
  buildNav();
  if (cached) { Replica.load(cached); const q = queue; queue = []; q.forEach(op => { try { Replica.act(op.action, Object.assign({}, op)); queue.push(op); } catch (e) {} }); showGame(); refreshView(); }
  try { await flush(); }
  catch (e) { if (!cached) { if (e.code === 'AUTH' || !TOKEN) return; $('loadingText').textContent = T('net_error'); setTimeout(startGame, 4000); return; } }
  if (!cached) showGame();
}
function showGame() {
  $('loading').classList.add('hidden'); $('game').classList.remove('hidden');
  Scene3D.resize();
  if (!ticker) {
    let n = 0, lastServerMoment = 0;
    ticker = setInterval(() => {
      if (!Replica.ready() || !TOKEN) return;
      n++;
      Replica.advance();
      refreshViewLight();
      if (n % 5 === 0 && sheet) refreshSheet();
      const sm = Replica.serverMoment();
      if (sm <= now() && sm !== lastServerMoment) { lastServerMoment = sm; flush().catch(() => {}); }
    }, 1000);
    setInterval(() => { if (TOKEN && document.visibilityState === 'visible') flush().catch(() => {}); }, 60000);
  }
  setTimeout(() => Coach.start(false), 600);
}
/** Лёгкое обновление раз в секунду: без перерисовки открытой панели. */
function refreshViewLight() { refreshView(true); tickTimers(); }

function bindGlobal() {
  $('authForm').addEventListener('submit', submitAuth);
  $('authTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { authTab = b.dataset.tab; renderAuth(); } });
  $('swatches').addEventListener('click', e => { const b = e.target.closest('[data-color]'); if (b && !b.disabled) { regColor = b.dataset.color; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.color === regColor)); haptic(); } });
  $('chars').addEventListener('click', e => { const b = e.target.closest('[data-char]'); if (b) { regChar = b.dataset.char; renderAuth(); } });
  document.querySelector('.lang-switch').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) { LANG = b.dataset.lang; localStorage.setItem('mh_lang', LANG); applyStaticTexts(); renderAuth(); document.querySelectorAll('.lang-switch button').forEach(x => x.classList.toggle('on', x.dataset.lang === LANG)); } });
  $('nav').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) onNav(b.dataset.nav); });
  $('tierTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tier]'); if (!b) return;
    const t = +b.dataset.tier; haptic();
    if (t <= hive().tiers) setActiveTier(t);
    else openSheet({ kind: 'tier2', title: T('tier2_title'), render: tier2Card, nav: 'hive' });
  });
  $('buildCard').addEventListener('click', () => { haptic(); plansSheet(); });
  $('selBar').addEventListener('click', e => { if (e.target.closest('#selClose')) clearSel(); else { haptic(); openSelected(); } });
  $('danceBtn').addEventListener('click', () => { haptic(); openDance(); });
  $('avatar').addEventListener('click', () => { haptic(); profileSheet(); });
  $('goal').addEventListener('click', e => {
    haptic();
    const cg = currentGoal(); if (!cg) return;
    if (cg.met) claimWith($('goal'), () => doAction(cg.src === 'tut' ? 'tutorialClaim' : 'goalClaim'), cg.rew);
    else Coach.hintFor(cg.id);
  });
  $('resbar').addEventListener('click', e => { const b = e.target.closest('[data-res]'); if (b) { haptic(); resourceSheet(b.dataset.res); } });
  $('infobar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b); });
  $('sheetClose').innerHTML = ui('close'); $('sheetBack').innerHTML = ui('back');
  $('sheetClose').addEventListener('click', closeSheet);
  // телефон присылает «клик» вслед за касанием, открывшим панель, — такой клик панель не закрывает
  $('sheetWrap').addEventListener('click', e => { if (e.target === $('sheetWrap') && Date.now() - sheetOpenedAt > 450) closeSheet(); });
  $('sheetBody').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b && !b.disabled) act(b); });
  $('sheetBody').addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.act === 'pshare') doAction('propolisShare', { share: el.value / 100 });
  });
  // смахивание панели вниз
  let sy = null;
  $('sheet').addEventListener('touchstart', e => { if ($('sheetBody').scrollTop <= 0) sy = e.touches[0].clientY; }, { passive: true });
  $('sheet').addEventListener('touchmove', e => { if (sy === null) return; const dy = e.touches[0].clientY - sy; if (dy > 0) $('sheet').style.transform = `translateY(${dy}px)`; }, { passive: true });
  $('sheet').addEventListener('touchend', e => {
    if (sy === null) return; const dy = (e.changedTouches[0].clientY - sy); sy = null;
    $('sheet').style.transform = '';
    if (dy > 90) closeSheet();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  $('mapCtl').innerHTML = `<button id="mZoomIn" aria-label="+">${ui('plus')}</button><button id="mZoomOut" aria-label="−">${ui('minus')}</button><button id="mHome" aria-label="${T('your_hive')}">${ui('hive')}</button><button id="mExp" aria-label="${T('expeditions')}">${ui('scroll')}</button>`;
  $('mZoomIn').onclick = () => MapView.zoomIn();
  $('mZoomOut').onclick = () => MapView.zoomOut();
  $('mHome').onclick = () => MapView.centerHome();
  $('mExp').onclick = () => expeditionsSheet();
  document.addEventListener('visibilitychange', () => {
    if (!TOKEN) return;
    if (document.visibilityState === 'visible') flush().catch(() => {});
    else if (queue.length) { // уходим — отправить без ожидания ответа
      const ops = queue.splice(0); saveLocal();
      rpcRaw({ action: 'batch', ops, snap: 1, token: TOKEN, keepalive: true }).then(r => { if (r && r.ok) loadSnap(r.snap); }).catch(() => { queue = ops.concat(queue); saveLocal(); });
    }
  });
}

async function boot() {
  applyStaticTexts();
  bindGlobal();
  if (TOKEN) { startGame(); return; }
  showAuth();
}
window.__dbg = { Scene3D, get S() { return S; } };
boot();
