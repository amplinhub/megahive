function eachCell(hd, fn) {
  for (var tier = 1; tier <= 3; tier++) {
    var row = hd.cells[tier] || {};
    for (var idx in row) fn(tier, Number(idx), row[idx]);
  }
}

function cellAt(hd, tier, idx) { return (hd.cells[tier] || {})[idx] || null; }

function countCells(hd, tier) { return Object.keys(hd.cells[tier] || {}).length; }

function countType(hd, b) {
  var n = 0;
  eachCell(hd, function (t, i, c) { if (c.b === b) n++; });
  return n;
}

function totalBees(hd) {
  var b = hd.bees;
  return b.forager + b.crafter + b.nurse + b.lookout;
}

function queuedBees(hd) {
  return hd.hatchQ.reduce(function (s, q) { return s + q.n; }, 0);
}

function brigades(hd) {
  return getCfg().gate[hd.gate].brigades + (hd.tiers >= 2 ? 1 : 0);
}

/** Соседи соты: на своём ярусе + та же позиция на соседних ярусах. */
function neighborCells(hd, tier, idx) {
  var out = [];
  HEX[idx].nb.forEach(function (n) { var c = cellAt(hd, tier, n); if (c) out.push(c); });
  [tier - 1, tier + 1].forEach(function (t) {
    if (t >= 1 && t <= 3) { var c = cellAt(hd, t, idx); if (c) out.push(c); }
  });
  return out;
}

/** Множитель соседства для соты типа b в позиции (tier, idx). */
function adjFactor(hd, tier, idx, b) {
  var cfg = getCfg();
  var def = cfg.buildings[b];
  var nb = neighborCells(hd, tier, idx);
  if (def.input) {
    var feeds = nb.filter(function (c) { return def.feeds.indexOf(c.b) >= 0; }).length;
    return 1 + Math.min(cfg.adjMax, feeds * cfg.adjBonus);
  }
  if (def.hatch) {
    var homes = nb.filter(function (c) { return HOUSING_TYPES.indexOf(c.b) >= 0; }).length;
    var noisy = nb.filter(function (c) { return cfg.buildings[c.b].noisy; }).length;
    return Math.max(0.4, 1 + Math.min(cfg.adjMax, homes * cfg.adjBonus) - noisy * cfg.noisyPenalty);
  }
  return 1;
}

/** Сводные параметры улья по его сотам. */
function hiveProfile(hd) {
  var cfg = getCfg();
  var g = cfg.gate[hd.gate];
  var p = {
    capN: g.store, capH: g.store, capWP: g.store, house: g.house,
    craftSlots: 0, nurseSlots: 0, nhIn: 0, nhOut: 0, hwIn: 0, hwOut: 0,
    jelly: 0, hatch: 0, lookoutCap: cfg.baseLookoutCap || 0
  };
  eachCell(hd, function (tier, idx, c) {
    var d = cfg.buildings[c.b];
    var L = c.l - 1;
    if (d.capNectar) p.capN += d.capNectar[L];
    if (d.capHoney) p.capH += d.capHoney[L];
    if (d.capWP) p.capWP += d.capWP[L];
    if (d.house) p.house += d.house[L];
    if (d.crafters) p.craftSlots += d.crafters[L];
    if (d.nurses) p.nurseSlots += d.nurses[L];
    if (d.lookoutCap) p.lookoutCap += d.lookoutCap[L];
    if (d.jelly) p.jelly += d.jelly[L];
    if (d.input) {
      var f = adjFactor(hd, tier, idx, c.b);
      if (d.input === 'nectar') { p.nhIn += d.inRate[L] * f; p.nhOut += d.outRate[L] * f; }
      else { p.hwIn += d.inRate[L] * f; p.hwOut += d.outRate[L] * f; }
    }
    if (d.hatch) p.hatch += d.hatch[L] * adjFactor(hd, tier, idx, c.b);
  });
  return p;
}

// ---------------------------------------------------------------- цены и время
function seasonCostMult(t) { return modsAt(t, false).buildCost; }

function newCellK(hd, tier) {
  var k = countCells(hd, tier);
  hd.jobs.forEach(function (j) { if (j.kind === 'new' && j.tier === tier) k++; });
  return k;
}

function costNew(hd, b, tier, t) {
  var cfg = getCfg();
  var k = newCellK(hd, tier);
  return scaleCost(cfg.buildings[b].cost, Math.pow(cfg.growthNew[tier], k) * seasonCostMult(t));
}

/** Базовое время (от него считаются долгие улучшения). */
function timeBaseSec(tier, k) {
  var cfg = getCfg();
  return Math.min(cfg.maxBuildSec, Math.round(cfg.timeBaseNewSec[tier] * Math.pow(cfg.timeGrowth[tier], k)));
}

/** Новая сота строится быстро: базовое время, делённое на newBuildSpeed. */
function timeNewSec(tier, k) {
  var sp = (getCfg().newBuildSpeed || {})[tier] || 1;
  return Math.max(4, Math.round(timeBaseSec(tier, k) / sp));
}

function costUpg(b, toLvl, t) {
  var cfg = getCfg();
  return scaleCost(cfg.buildings[b].cost, cfg.upgCostMult[toLvl] * seasonCostMult(t));
}

function timeUpgSec(hd, tier, toLvl) {
  var cfg = getCfg();
  var base = timeBaseSec(tier, countCells(hd, tier)) * cfg.upgTimeMult[toLvl];
  return Math.round(clamp(base, cfg.minUpgSecPerTier * tier, cfg.maxBuildSec));
}

function costGate(hd, t) {
  var cfg = getCfg();
  var g = cfg.gate[hd.gate + 1];
  return scaleCost(g.cost, seasonCostMult(t));
}

/** Цена и время пункта плана в момент t. */
function planItemCost(hd, item, t) {
  if (item.kind === 'new') {
    return { cost: costNew(hd, item.b, item.tier, t), sec: timeNewSec(item.tier, newCellK(hd, item.tier)) };
  }
  if (item.kind === 'upg') {
    var c = cellAt(hd, item.tier, item.idx);
    var lvl = c ? c.l : 1;
    return { cost: costUpg(c ? c.b : item.b, lvl + 1, t), sec: timeUpgSec(hd, item.tier, lvl + 1) };
  }
  if (item.kind === 'gate') return { cost: costGate(hd, t), sec: getCfg().gate[hd.gate + 1].sec };
  return null;
}

function canAfford(res, cost) {
  for (var k in cost) if ((res[k] || 0) < cost[k] - 1e-9) return false;
  return true;
}

function pay(res, cost, mult) {
  for (var k in cost) res[k] = (res[k] || 0) - cost[k] * (mult || 1);
}

function missing(res, cost) {
  var out = {};
  for (var k in cost) if ((res[k] || 0) < cost[k]) out[k] = Math.ceil(cost[k] - (res[k] || 0));
  return out;
}

// ---------------------------------------------------------------- потоки за час
function activeBuffMult(pd, type, t) {
  var m = 1;
  (pd.buffs || []).forEach(function (b) { if (b.type === type && b.from <= t && b.until > t) m += b.bonus; });
  return m;
}

function isCocoon(ctx, t) {
  return t - Number(ctx.player.createdAt) < getCfg().cocoonHours * HOUR;
}

/**
 * Потоки ресурсов в час для каждого улья в момент t (без учёта наличия сырья).
 * Возвращает { hives: [{ gN, gP, nhIn, nhOut, hwIn, hwOut, jelly, upkeep, heat, hatch, prof, mods, wfill, nfill }], caps }.
 */
function computeFlows(ctx, t) {
  var cfg = getCfg();
  var pd = ctx.pd;
  var hungry = pd.res.honey <= 0;
  var eff = hungry ? cfg.hungerEff : 1;
  var boost = isCocoon(ctx, t) ? cfg.cocoonBoost : 1;
  var gBuff = activeBuffMult(pd, 'gather', t) * activeBuffMult(pd, 'sting', t);
  var caps = { nectar: 0, honey: 0, wp: 0 };
  var out = [];
  ctx.hives.forEach(function (h) {
    var hd = h.hd;
    var mods = modsAt(t, h.land.spring);
    var prof = hiveProfile(hd);
    caps.nectar += prof.capN; caps.honey += prof.capH; caps.wp += prof.capWP;
    var fA = Math.max(0, hd.bees.forager - hd.away.forager);
    var ps = hd.pShare;
    var gN = 0, gP = 0;
    if (!mods.gatherBlocked) {
      gN = Math.min(fA * (1 - ps) * cfg.gatherNectar, h.land.nectar) * mods.nectar * eff * boost * gBuff;
      gP = Math.min(fA * ps * cfg.gatherPropolis, h.land.propolis) * mods.propolis * eff * boost * gBuff;
    }
    var wfill = prof.craftSlots ? Math.min(1, hd.bees.crafter / prof.craftSlots) : 0;
    var nfill = prof.nurseSlots ? Math.min(1, hd.bees.nurse / prof.nurseSlots) : 0;
    var k = wfill * eff * boost * mods.process;
    var bees = totalBees(hd);
    out.push({
      gN: gN, gP: gP,
      nhIn: prof.nhIn * k, nhOut: prof.nhOut * k,
      hwIn: prof.hwIn * k, hwOut: prof.hwOut * k * mods.wax,
      jelly: prof.jelly * nfill * eff * boost,
      upkeep: bees * cfg.upkeep * mods.upkeep,
      heat: mods.heat ? bees / 50 * cfg.winterHeatPer50BeesDay / 24 * mods.heat : 0,
      hatch: hd.hatchQ.length ? prof.hatch * nfill * eff * boost : 0,
      prof: prof, mods: mods, wfill: wfill, nfill: nfill
    });
  });
  return { hives: out, caps: caps };
}

/** Применяет потоки за dt часов. */
function applyFlows(ctx, fl, dt) {
  var cfg = getCfg();
  var r = ctx.pd.res;
  var caps = fl.caps;
  var honeyBefore = r.honey;
  fl.hives.forEach(function (f, i) {
    var hd = ctx.hives[i].hd;
    // сбор
    if (r.nectar < caps.nectar) r.nectar = Math.min(caps.nectar, r.nectar + f.gN * dt);
    if (r.propolis < caps.wp) r.propolis = Math.min(caps.wp, r.propolis + f.gP * dt);
    // нектар -> мёд
    if (f.nhIn > 0) {
      var use = Math.min(f.nhIn * dt, r.nectar);
      r.nectar -= use;
      var made = use * f.nhOut / f.nhIn;
      r.honey += made;
      ctx.pd.stats.honeyMade += made;
    }
    // мёд -> воск (резерв на содержание, автопауза при полном складе)
    if (f.hwIn > 0 && r.wax < cfg.autopauseAt * caps.wp) {
      var reserve = f.upkeep * cfg.honeyReserveHours;
      var useH = Math.max(0, Math.min(f.hwIn * dt, r.honey - reserve));
      r.honey -= useH;
      r.wax = Math.min(caps.wp, r.wax + useH * f.hwOut / f.hwIn);
    }
    r.jelly += f.jelly * dt;
    r.honey -= f.upkeep * dt;
    if (f.heat) r.propolis = Math.max(0, r.propolis - f.heat * dt);
    // вывод пчёл
    if (f.hatch > 0 && hd.hatchQ.length) {
      hd.hatchProg += f.hatch * dt;
      while (hd.hatchProg >= 1 && hd.hatchQ.length) {
        var q = hd.hatchQ[0];
        hd.bees[q.role]++;
        q.n--;
        hd.hatchProg -= 1;
        ctx.pd.stats.hatched++;
        if (q.n <= 0) hd.hatchQ.shift();
      }
    }
    if (!hd.hatchQ.length) hd.hatchProg = 0;
  });
  if (r.honey < 0) r.honey = 0;
  if (r.honey > caps.honey) r.honey = Math.max(caps.honey, Math.min(r.honey, honeyBefore));
}

// ---------------------------------------------------------------- стройки
function startPlanItems(ctx, t) {
  ctx.hives.forEach(function (h) {
    var hd = h.hd;
    while (hd.plan.length && hd.jobs.length < brigades(hd)) {
      var item = hd.plan[0];
      var v = planItemReady(hd, item);
      if (v === 'drop') { hd.plan.shift(); continue; }
      if (v === 'wait') break;
      var pc = planItemCost(hd, item, t);
      if (!canAfford(ctx.pd.res, pc.cost)) break;
      pay(ctx.pd.res, pc.cost);
      var job = { id: item.id, kind: item.kind, tier: item.tier, idx: item.idx, b: item.b,
                  start: t, end: t + pc.sec * 1000, cost: pc.cost };
      if (item.kind === 'upg') job.toLvl = cellAt(hd, item.tier, item.idx).l + 1;
      if (item.kind === 'gate') job.toLvl = hd.gate + 1;
      hd.jobs.push(job);
      hd.plan.shift();
    }
  });
}

/** 'ok' — можно начинать, 'wait' — ждать, 'drop' — пункт больше невозможен. */
function planItemReady(hd, item) {
  var cfg = getCfg();
  if (item.kind === 'new') {
    if (item.tier > hd.tiers) return 'drop';
    if (cellAt(hd, item.tier, item.idx)) return 'drop';
    return 'ok';
  }
  if (item.kind === 'upg') {
    var busy = hd.jobs.some(function (j) { return j.tier === item.tier && j.idx === item.idx; });
    if (busy) return 'wait';
    var c = cellAt(hd, item.tier, item.idx);
    if (!c || c.l >= 3) return 'drop';
    return 'ok';
  }
  if (item.kind === 'gate') {
    if (hd.jobs.some(function (j) { return j.kind === 'gate'; })) return 'wait';
    if (hd.gate >= 3) return 'drop';
    if (countCells(hd, 1) < cfg.gate[hd.gate + 1].needCells) return 'wait';
    return 'ok';
  }
  return 'drop';
}

function completeJobs(ctx, t) {
  ctx.hives.forEach(function (h) {
    var hd = h.hd;
    var done = hd.jobs.filter(function (j) { return j.end <= t; });
    if (!done.length) return;
    hd.jobs = hd.jobs.filter(function (j) { return j.end > t; });
    done.sort(function (a, b) { return a.end - b.end; });
    done.forEach(function (j) {
      if (j.kind === 'new') {
        hd.cells[j.tier][j.idx] = { b: j.b, l: 1 };
        ctx.pd.stats.built++;
      } else if (j.kind === 'upg') {
        var c = cellAt(hd, j.tier, j.idx);
        if (c) c.l = j.toLvl;
        ctx.pd.stats.upgraded++;
      } else if (j.kind === 'gate') {
        hd.gate = j.toLvl;
        feedPush(ctx, 'gate', { l: hd.gate }, '', j.end);
        h.row.radius = getCfg().gate[hd.gate].radius;
        h.land = null; // пересчитать землю
      }
    });
    if (!h.land) refreshLand(ctx, h, t);
  });
}

function refreshLand(ctx, h, t) {
  var brief = allHivesBrief().map(function (b) {
    return b.id === h.row.id ? { id: b.id, x: b.x, y: b.y, radius: Number(h.row.radius) } : b;
  });
  h.land = landFor(Number(h.row.x), Number(h.row.y), Number(h.row.radius), calendarAt(t).season, brief);
  h.landSeason = calendarAt(t).season;
}

/** Ближайшее событие после t (завершение стройки, экспедиции, конец кокона). */
function nextBreakpoint(ctx, t) {
  var best = Infinity;
  ctx.hives.forEach(function (h) {
    h.hd.jobs.forEach(function (j) { if (j.end > t && j.end < best) best = j.end; });
  });
  (ctx.pd.exps || []).forEach(function (e) {
    var nt = expNextTime(e);
    if (nt && nt > t && nt < best) best = nt;
  });
  var cocoonEnd = Number(ctx.player.createdAt) + getCfg().cocoonHours * HOUR;
  if (cocoonEnd > t && cocoonEnd < best) best = cocoonEnd;
  return best;
}

/** Досчитывает состояние игрока до now. */
function advance(ctx, now) {
  var cfg = getCfg();
  var pd = ctx.pd;
  var t = Number(pd.lastTs) || now;
  if (now - t > cfg.maxCatchupHours * HOUR) t = now - cfg.maxCatchupHours * HOUR;
  var stepMs = cfg.stepMinutes * 60000;
  completeJobs(ctx, t);
  processExpeditions(ctx, t);
  startPlanItems(ctx, t);
  var guard = 0;
  while (t < now && guard++ < 20000) {
    var next = Math.min(t + stepMs, now, nextBreakpoint(ctx, t));
    if (next <= t) next = Math.min(t + 1000, now);
    // земля зависит от сезона: пересчитываем при смене недели
    var season = calendarAt(t).season;
    ctx.hives.forEach(function (h) { if (h.landSeason !== season) refreshLand(ctx, h, t); });
    var fl = computeFlows(ctx, t);
    applyFlows(ctx, fl, (next - t) / HOUR);
    applyOnceEvents(ctx, next);
    t = next;
    completeJobs(ctx, t);
    processExpeditions(ctx, t);
    startPlanItems(ctx, t);
  }
  pd.lastTs = now;
  pd.buffs = (pd.buffs || []).filter(function (b) { return b.until > now; });
}

/** Разовые эффекты событий (Медовый Спас). */
function applyOnceEvents(ctx, t) {
  var cal = calendarAt(t);
  if (cal.event === 'honey_spas') {
    var key = 'spas_' + cal.week;
    if (!ctx.pd.once[key]) {
      ctx.pd.once[key] = true;
      var caps = computeFlows(ctx, t).caps;
      ctx.pd.res.honey = Math.min(caps.honey, ctx.pd.res.honey * 1.1);
      pushNotice(ctx, 'honey_spas', {});
    }
  }
}

function pushNotice(ctx, code, params) {
  ctx.pd.notices = ctx.pd.notices || [];
  ctx.pd.notices.push({ code: code, params: params, ts: NOW() });
  if (ctx.pd.notices.length > 10) ctx.pd.notices = ctx.pd.notices.slice(-10);
}

/** Энергия танца (ленивое восстановление). */
function refreshEnergy(pd, now) {
  var cfg = getCfg();
  if (pd.energy >= cfg.energyMax) { pd.energy = cfg.energyMax; pd.energyTs = now; return; }
  var ticks = Math.floor((now - pd.energyTs) / (cfg.energyRegenSec * 1000));
  if (ticks > 0) {
    pd.energy = Math.min(cfg.energyMax, pd.energy + ticks);
    pd.energyTs += ticks * cfg.energyRegenSec * 1000;
    if (pd.energy >= cfg.energyMax) pd.energyTs = now;
  }
}

function computeGlory(ctx) {
  var cfg = getCfg();
  var g = 0;
  ctx.hives.forEach(function (h) {
    eachCell(h.hd, function (t, i, c) { g += c.l * cfg.gloryPerLevel; });
    g += h.hd.gate * cfg.gloryPerLevel + cfg.gloryPerHive;
  });
  return g;
}

// ---- Expeditions.gs
/** Экспедиции: полёт к клетке карты, находки, текстовые события с выбором, возвращение. */

function expNextTime(e) {
  if (e.status === 'out') return e.arrive;
  if (e.status === 'choice') return e.deadline;
  if (e.status === 'return') return e.back;
  return null;
}

function apiExpeditionSend(ctx, req) {
  var cfg = getCfg();
  var now = NOW();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var x = Math.floor(Number(req.x)), y = Math.floor(Number(req.y));
  var L = Math.floor(Number(req.lookouts) || 0), F = Math.floor(Number(req.foragers) || 0);
  if (x < 0 || y < 0 || x >= cfg.mapSize || y >= cfg.mapSize) throw gameErr('BAD_TARGET');
  var dist = mapDist(Number(h.row.x), Number(h.row.y), x, y);
  if (dist < 1) throw gameErr('BAD_TARGET');
  if (!countType(hd, 'scout_nest') && dist > cfg.noNestRange) throw gameErr('EXP_RANGE', { max: cfg.noNestRange });
  if (L < 1) throw gameErr('NEED_LOOKOUT');
  if (F < 0) throw gameErr('BAD_AMOUNT');
  var active = ctx.pd.exps.filter(function (e) { return e.status !== 'done'; }).length;
  if (active >= cfg.maxExpeditions) throw gameErr('EXP_LIMIT', { max: cfg.maxExpeditions });
  if (L > hd.bees.lookout - hd.away.lookout) throw gameErr('NOT_ENOUGH_BEES', { have: hd.bees.lookout - hd.away.lookout });
  if (F > hd.bees.forager - hd.away.forager) throw gameErr('NOT_ENOUGH_BEES', { have: hd.bees.forager - hd.away.forager });
  var travel = expTravelMs(dist, F > 0, modsAt(now, false));
  hd.away.lookout += L;
  hd.away.forager += F;
  var e = {
    id: clientId(req, 'x'), hiveId: h.row.id, x: x, y: y, lookouts: L, foragers: F,
    depart: now, arrive: now + travel, travel: travel, status: 'out', loot: {}, lost: { lookout: 0, forager: 0 }
  };
  ctx.pd.exps.push(e);
  ctx.pd.stats.expeditions++;
  return { id: e.id, arrive: e.arrive };
}

function expTravelMs(dist, withForagers, mods) {
  var cfg = getCfg();
  var speed = withForagers ? cfg.speed.forager : cfg.speed.lookout;
  var ms = dist / speed * HOUR / (mods.expSpeed || 1);
  return Math.round(Math.min(cfg.maxTravelSec * 1000, Math.max(60000, ms)));
}

/** Предпросмотр времени полёта для клиента. */
function apiExpeditionPreview(ctx, req) {
  var h = getHive(ctx, req.hiveId);
  var dist = mapDist(Number(h.row.x), Number(h.row.y), Number(req.x), Number(req.y));
  var mods = modsAt(NOW(), false);
  return { dist: dist, lookoutMs: expTravelMs(dist, false, mods), foragerMs: expTravelMs(dist, true, mods) };
}

function processExpeditions(ctx, t) {
  var cfg = getCfg();
  (ctx.pd.exps || []).forEach(function (e) {
    for (var guard = 0; guard < 4; guard++) {
      var nt = expNextTime(e);
      if (!nt || nt > t) break;
      if (e.status === 'out') expArrive(ctx, e);
      else if (e.status === 'choice') {
        var safe = 0;
        e.event.options.forEach(function (o, i) { if (o.safe) safe = i; });
        expResolve(ctx, e, safe, e.deadline, true);
      } else if (e.status === 'return') expFinish(ctx, e);
    }
  });
  ctx.pd.exps = ctx.pd.exps.filter(function (e) { return e.status !== 'done'; });
}

function carryOf(e) {
  var cfg = getCfg();
  return (e.lookouts - e.lost.lookout) * cfg.carry.lookout + (e.foragers - e.lost.forager) * cfg.carry.forager;
}

function expArrive(ctx, e) {
  var cfg = getCfg();
  var t = e.arrive;
  var rng = makeRng(e.id + ':arrive');
  ctx.pd.fog = fogReveal(ctx.pd.fog, e.x, e.y, cfg.expRevealRadius);
  var mods = modsAt(t, false);
  var zone = zoneOf(e.x, e.y);
  var terrain = terrainAt(e.x, e.y);
  var found = { terrain: terrain, zone: zone };
  var loot = {};
  var carry = carryOf(e);
  // объект на клетке
  var obj = null;
  dbTable('Map_Objects').forEach(function (o) {
    if (Number(o.x) === e.x && Number(o.y) === e.y) {
      var d = parseJson(o.data, {});
      if (!d.until || d.until > t) obj = o;
    }
  });
  if (obj) {
    var od = parseJson(obj.data, {});
    found.object = obj.type;
    od.lootedBy = od.lootedBy || {};
    var recently = od.lootedBy[ctx.player.id] && t - od.lootedBy[ctx.player.id] < cfg.objectLootCooldownH * HOUR;
    if (obj.type.indexOf('hollow') === 0) {
      od.scoutedBy = od.scoutedBy || {};
      od.scoutedBy[ctx.player.id] = t;
      found.guardsWord = guardsWord(od.guards);
      found.cells = od.cells;
    } else if (recently) {
      found.empty = true;
    } else {
      var zm = cfg.zoneMult[zone];
      if (obj.type === 'honeycache') loot.honey = Math.min(carry, Math.round(rngInt(rng, 120, 300) * zm));
      if (obj.type === 'glade') { loot.jelly = rngInt(rng, 2, 5); if (rng() < 0.15) loot.amber = 1; }
      if (obj.type === 'aphids') { loot.honey = Math.min(carry, rngInt(rng, 50, 150)); if (rng() < 0.35) loot.amber = 1; }
      if (obj.type === 'crystal') loot.jelly = rngInt(rng, 5, 10);
      od.lootedBy[ctx.player.id] = t;
    }
    obj.data = JSON.stringify(od);
    dbUpdate('Map_Objects', obj);
  } else {
    var yl = terrainYield(terrain, zone, calendarAt(t).season);
    if (yl[0] > 0) loot.nectar = Math.min(carry, Math.round(yl[0] * 6));
    if (yl[1] > 0) loot.propolis = Math.min(Math.max(0, carry - (loot.nectar || 0)), Math.round(yl[1] * 8));
  }
  if (mods.expLoot !== 1) for (var k in loot) if (k !== 'amber') loot[k] = Math.round(loot[k] * mods.expLoot);
  e.loot = loot;
  e.found = found;
  // текстовое событие
  var tag = (terrain === 'F' || terrain === 'E') ? 'forest' : (terrain === 'M' || terrain === 'B') ? 'meadow' : 'other';
  var pool = EXP_EVENTS.filter(function (ev) { return ev.tags.indexOf('any') >= 0 || ev.tags.indexOf(tag) >= 0; });
  if (pool.length && rng() < cfg.expEventChance) {
    var ev = rngPick(rng, pool);
    e.event = { id: ev.id, options: ev.options.map(function (o) { return { safe: !!o.safe }; }) };
    e.status = 'choice';
    e.deadline = t + cfg.expChoiceTimeoutSec * 1000;
  } else {
    e.status = 'return';
    e.back = t + e.travel;
  }
}

function expResolve(ctx, e, optIndex, t, auto) {
  var ev = EXP_EVENTS.filter(function (x) { return x.id === e.event.id; })[0];
  var opt = ev.options[optIndex];
  if (!opt) throw gameErr('BAD_OPTION');
  var rng = makeRng(e.id + ':opt:' + optIndex);
  var ok = rng() < opt.p;
  var out = (ok ? opt.win : opt.fail) || {};
  if (out.loot !== undefined) for (var k in e.loot) if (k !== 'amber') e.loot[k] = Math.round(e.loot[k] * out.loot);
  if (out.add) for (var a in out.add) e.loot[a] = (e.loot[a] || 0) + out.add[a];
  if (out.lose) {
    e.lost.lookout = Math.min(e.lookouts - 1, Math.round(e.lookouts * out.lose));
    e.lost.forager = Math.round(e.foragers * out.lose);
    var cap = carryOf(e);
    ['nectar', 'propolis', 'honey', 'wax'].forEach(function (r) { if (e.loot[r] > cap) e.loot[r] = cap; });
  }
  if (out.join) e.join = out.join;
  if (out.reveal) ctx.pd.fog = fogReveal(ctx.pd.fog, e.x, e.y, getCfg().expRevealRadius + out.reveal);
  e.event.chosen = optIndex;
  e.event.success = ok;
  e.event.auto = !!auto;
  e.status = 'return';
  e.back = t + e.travel;
}

function expFinish(ctx, e) {
  var h = null;
  ctx.hives.forEach(function (x) { if (x.row.id === e.hiveId) h = x; });
  if (h) {
    var hd = h.hd;
    hd.away.lookout = Math.max(0, hd.away.lookout - e.lookouts);
    hd.away.forager = Math.max(0, hd.away.forager - e.foragers);
    hd.bees.lookout = Math.max(0, hd.bees.lookout - e.lost.lookout);
    hd.bees.forager = Math.max(0, hd.bees.forager - e.lost.forager) + (e.join || 0);
  }
  for (var k in e.loot) ctx.pd.res[k] = (ctx.pd.res[k] || 0) + e.loot[k];
  if (e.loot.amber) feedPush(ctx, 'amber', { x: e.x, y: e.y }, '', e.back);
  ctx.pd.reports.unshift({
    type: 'expedition', ts: e.back, x: e.x, y: e.y, loot: e.loot, lost: e.lost, join: e.join || 0,
    found: e.found, event: e.event || null
  });
  ctx.pd.reports = ctx.pd.reports.slice(0, 20);
  e.status = 'done';
}

function apiExpeditionChoose(ctx, req) {
  var e = ctx.pd.exps.filter(function (x) { return x.id === req.id; })[0];
  if (!e || e.status !== 'choice') throw gameErr('NOT_FOUND');
  expResolve(ctx, e, Number(req.option), NOW(), false);
  return { success: e.event.success, loot: e.loot, lost: e.lost, join: e.join || 0 };
}

/** Текст события на языке игрока (для клиента). */
function expEventView(e, lang) {
  if (!e.event) return null;
  var ev = EXP_EVENTS.filter(function (x) { return x.id === e.event.id; })[0];
  var L = lang === 'en' ? 'en' : 'ru';
  return {
    id: ev.id, title: ev[L].title, text: ev[L].text,
    options: ev.options.map(function (o) {
      return { label: o[L], safe: !!o.safe, risk: o.p < 1 ? Math.round((1 - o.p) * 100) : 0 };
    }),
    chosen: e.event.chosen, success: e.event.success, auto: e.event.auto
  };
}

// ---- Map.gs
/** Карта 50×50: генерация по seed, стартовые позиции, земля вокруг улья, туман. */

/** Сглаженный шум: случайные значения в узлах сетки + билинейная интерполяция. */
function makeNoise(rng, size, step) {
  var n = Math.ceil(size / step) + 2;
  var g = [];
  for (var i = 0; i < n * n; i++) g.push(rng());
  return function (x, y) {
    var gx = x / step, gy = y / step;
    var x0 = Math.floor(gx), y0 = Math.floor(gy);
    var fx = gx - x0, fy = gy - y0;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = g[y0 * n + x0], b = g[y0 * n + x0 + 1], c = g[(y0 + 1) * n + x0], d = g[(y0 + 1) * n + x0 + 1];
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  };
}

function zoneOf(x, y) {
  var n = getCfg().mapSize;
  var c = (n - 1) / 2;
  var d = Math.max(Math.abs(x - c), Math.abs(y - c));
  if (d < n * 0.24) return 1;   // центр 24×24
  if (d < n * 0.40) return 2;   // до 40×40
  return 3;
}

/** Генерирует рельеф и объекты. Возвращает { rows: [строки букв], objects: [...] }. */
function generateMap(seed) {
  var cfg = getCfg();
  var n = cfg.mapSize;
  var rng = makeRng(seed);
  var forest = makeNoise(rng, n, 7), water = makeNoise(rng, n, 9), bloom = makeNoise(rng, n, 5), rock = makeNoise(rng, n, 4);
  var grid = [];
  for (var y = 0; y < n; y++) {
    var row = '';
    for (var x = 0; x < n; x++) {
      var t = 'M';
      var w = water(x, y), f = forest(x, y), b = bloom(x, y), r = rock(x, y);
      if (w > 0.83) t = 'W';
      else if (r > 0.86) t = 'R';
      else if (f > 0.68) t = 'F';
      else if (f > 0.56) t = 'E';
      else if (b > 0.68) t = 'B';
      if ((t === 'M' || t === 'E') && rng() < 0.03) t = 'S';
      row += t;
    }
    grid.push(row);
  }
  // объекты
  var objects = [];
  var taken = {};
  function free(x, y, minD) {
    var tt = grid[y].charAt(x);
    if (tt === 'W' || tt === 'R') return false;
    for (var i = 0; i < objects.length; i++) if (mapDist(objects[i].x, objects[i].y, x, y) < minD) return false;
    return true;
  }
  function place(type, zone, data) {
    for (var tries = 0; tries < 2000; tries++) {
      var x = rngInt(rng, 1, n - 2), y = rngInt(rng, 1, n - 2);
      if (zone && zoneOf(x, y) !== zone) continue;
      if (!free(x, y, 3)) continue;
      objects.push({ id: 'o' + objects.length, x: x, y: y, type: type, data: data(x, y) });
      return;
    }
  }
  // великаны в углах
  [[2, 2], [n - 3, 2], [2, n - 3], [n - 3, n - 3]].forEach(function (p) {
    grid[p[1]] = grid[p[1]].substring(0, p[0]) + 'F' + grid[p[1]].substring(p[0] + 1);
    objects.push({ id: 'o' + objects.length, x: p[0], y: p[1], type: 'hollow_giant',
      data: { guards: rngInt(rng, 2500, 3200), cells: 36 } });
  });
  var oc = cfg.objects;
  var i;
  for (i = 0; i < oc.hollow_ancient; i++) place('hollow_ancient', 3, function () { return { guards: rngInt(rng, 800, 1500), cells: rngInt(rng, 20, 28) }; });
  for (i = 0; i < oc.hollow_old; i++) place('hollow_old', 2, function () { return { guards: rngInt(rng, 200, 400), cells: rngInt(rng, 12, 18) }; });
  for (i = 0; i < oc.hollow_small; i++) place('hollow_small', 1, function () { return { guards: rngInt(rng, 40, 80), cells: rngInt(rng, 6, 10) }; });
  for (i = 0; i < oc.glade; i++) place('glade', rng() < 0.5 ? 2 : 3, function () { return {}; });
  for (i = 0; i < oc.honeycache; i++) place('honeycache', 0, function () { return {}; });
  return { rows: grid, objects: objects };
}

function terrainYield(t, zone, season) {
  var cfg = getCfg();
  var y = cfg.terrainYield[t] || [0, 0];
  var m = cfg.zoneMult[zone];
  var n = y[0] * m, p = y[1] * m;
  if (t === 'B') {
    if (season === 0) n *= cfg.bloomSpring;
    if (season === 3) n *= cfg.season[3].bloom;
  }
  return [n, p];
}

/** Все ульи (для дележа клеток): [{id,x,y,radius}]. */
function allHivesBrief() {
  return dbTable('Hives').map(function (h) {
    return { id: h.id, ownerId: h.ownerId, x: Number(h.x), y: Number(h.y), radius: Number(h.radius) };
  });
}

/**
 * Земля улья: нектар/ч и прополис/ч с клеток в радиусе (без сезонных общих множителей),
 * с учётом дележа клеток между ульями. Возвращает также, есть ли родник рядом.
 */
function landFor(hx, hy, radius, season, hivesBrief) {
  var n = getCfg().mapSize;
  var nec = 0, pro = 0, spring = false, cells = 0, shared = 0;
  for (var y = hy - radius; y <= hy + radius; y++) {
    for (var x = hx - radius; x <= hx + radius; x++) {
      if (x < 0 || y < 0 || x >= n || y >= n) continue;
      if (x === hx && y === hy) continue;
      var t = terrainAt(x, y);
      if (t === 'S') spring = true;
      var k = 0;
      for (var i = 0; i < hivesBrief.length; i++) {
        var h = hivesBrief[i];
        if (h.x === x && h.y === y) { k = -1; break; } // клетка занята другим ульем
        if (mapDist(h.x, h.y, x, y) <= h.radius) k++;
      }
      if (k < 0) continue;
      if (k < 1) k = 1;
      var yl = terrainYield(t, zoneOf(x, y), season);
      nec += yl[0] / k; pro += yl[1] / k;
      cells++;
      if (k > 1) shared++;
    }
  }
  return { nectar: nec, propolis: pro, spring: spring, cells: cells, shared: shared };
}

/** Выбор стартовой клетки: центральная зона, подальше от соседей, с хорошими лугами. */
function pickStartPosition() {
  var cfg = getCfg();
  var n = cfg.mapSize;
  var hives = allHivesBrief();
  var objects = dbTable('Map_Objects');
  var rng = makeRng(NOW());
  var best = null;
  for (var y = 2; y < n - 2; y++) {
    for (var x = 2; x < n - 2; x++) {
      if (zoneOf(x, y) !== 1) continue;
      var t = terrainAt(x, y);
      if (t !== 'M' && t !== 'B' && t !== 'E') continue;
      var minD = 99;
      for (var i = 0; i < hives.length; i++) minD = Math.min(minD, mapDist(hives[i].x, hives[i].y, x, y));
      if (minD < cfg.startMinDist) continue;
      var nearObj = false;
      for (var j = 0; j < objects.length; j++) {
        if (mapDist(Number(objects[j].x), Number(objects[j].y), x, y) < 2) { nearObj = true; break; }
      }
      if (nearObj) continue;
      var land = landFor(x, y, 2, 0, hives);
      if (land.propolis < 3 || land.nectar < 100) continue; // без смолы рядом не открыть ярус 2
      var score = Math.min(minD, 8) + land.nectar / 40 + Math.min(land.propolis, 12) / 6 + rng() * 1.5;
      if (!best || score > best.score) best = { x: x, y: y, score: score };
    }
  }
  return best;
}

// ---------------------------------------------------------------- туман
function fogEmpty() {
  var n = getCfg().mapSize;
  return new Array(Math.ceil(n * n / 4) + 1).join('0');
}

function fogGet(fog, x, y) {
  var n = getCfg().mapSize;
  var i = y * n + x;
  var nib = parseInt(fog.charAt(i >> 2), 16);
  return (nib >> (i & 3)) & 1;
}

function fogReveal(fog, cx, cy, r) {
  var n = getCfg().mapSize;
  var arr = fog.split('');
  for (var y = cy - r; y <= cy + r; y++) {
    for (var x = cx - r; x <= cx + r; x++) {
      if (x < 0 || y < 0 || x >= n || y >= n) continue;
      var i = y * n + x;
      var nib = parseInt(arr[i >> 2], 16) | (1 << (i & 3));
      arr[i >> 2] = nib.toString(16);
    }
  }
  return arr.join('');
}

/** Радиус обзора улья. */
function hiveVision(hd) {
  var cfg = getCfg();
  var v = cfg.visionBase;
  eachCell(hd, function (tier, idx, c) {
    var b = cfg.buildings[c.b];
    if (b.vision) v = Math.max(v, cfg.visionBase + b.vision[c.l - 1]);
  });
  return v;
}

/** Данные карты для клиента: неизвестные клетки помечены '?'. */
function apiMap(ctx) {
  var cfg = getCfg();
  var n = cfg.mapSize;
  var pd = ctx.pd;
  var grid = getMapGrid();
  var out = '';
  for (var i = 0; i < n * n; i++) {
    out += fogGet(pd.fog, i % n, Math.floor(i / n)) ? grid.charAt(i) : '?';
  }
  var players = {};
  dbTable('Players').forEach(function (p) { players[p.id] = { name: p.name, color: p.color }; });
  var hives = dbTable('Hives').filter(function (h) {
    return h.ownerId === ctx.player.id || fogGet(pd.fog, Number(h.x), Number(h.y));
  }).map(function (h) {
    return { id: h.id, x: Number(h.x), y: Number(h.y), radius: Number(h.radius), main: !!Number(h.main),
             own: h.ownerId === ctx.player.id, owner: players[h.ownerId] ? players[h.ownerId].name : '?',
             color: players[h.ownerId] ? players[h.ownerId].color : '#999' };
  });
  var now = NOW();
  var objects = dbTable('Map_Objects').filter(function (o) {
    return fogGet(pd.fog, Number(o.x), Number(o.y));
  }).map(function (o) {
    var d = parseJson(o.data, {});
    if (d.until && d.until < now) return null;
    var looted = d.lootedBy && d.lootedBy[ctx.player.id] && now - d.lootedBy[ctx.player.id] < cfg.objectLootCooldownH * HOUR;
    var info = { id: o.id, x: Number(o.x), y: Number(o.y), type: o.type, looted: !!looted };
    if (d.scoutedBy && d.scoutedBy[ctx.player.id]) info.guardsWord = guardsWord(d.guards);
    return info;
  }).filter(function (o) { return o; });
  return { size: n, grid: out, hives: hives, objects: objects };
}

/** Численность словами, как в «Героях». */
function guardsWord(n) {
  var t = [[4, 'few'], [9, 'group'], [19, 'squad'], [49, 'crowd'], [99, 'swarm'], [249, 'host'], [499, 'horde']];
  for (var i = 0; i < t.length; i++) if (n <= t[i][0]) return t[i][1];
  return 'legion';
}

// ---- Quests.gs
/** Обучение, ежедневные задания, календарь входа. */

function maxGate(ctx) { return Math.max.apply(null, ctx.hives.map(function (h) { return h.hd.gate; })); }

function tutorialMet(ctx, need) {
  var pd = ctx.pd;
  var main = ctx.hives[0].hd;
  if (need.building) {
    var n = 0;
    ctx.hives.forEach(function (h) { n += countType(h.hd, need.building); });
    return n >= need.count;
  }
  if (need.stat) return (pd.stats[need.stat] || 0) >= need.count;
  if (need.gate) return maxGate(ctx) >= need.gate;
  if (need.cellsT1) return countCells(main, 1) >= need.cellsT1;
  if (need.tiers) return main.tiers >= need.tiers;
  return false;
}

function tutorialView(ctx) {
  var cfg = getCfg();
  var step = ctx.pd.tutorial.step;
  if (step >= cfg.tutorial.length) return { done: true, total: cfg.tutorial.length };
  var q = cfg.tutorial[step];
  return { done: false, step: step, total: cfg.tutorial.length, id: q.id, rew: q.rew, met: tutorialMet(ctx, q.need), need: q.need };
}

function grant(ctx, rew, mult) {
  for (var k in rew) ctx.pd.res[k] = (ctx.pd.res[k] || 0) + Math.round(rew[k] * (mult || 1));
}

function apiTutorialClaim(ctx) {
  var cfg = getCfg();
  var step = ctx.pd.tutorial.step;
  var q = cfg.tutorial[step];
  if (!q) throw gameErr('NOT_FOUND');
  if (!tutorialMet(ctx, q.need)) throw gameErr('NOT_DONE');
  grant(ctx, q.rew);
  ctx.pd.tutorial.step++;
  ensureGoal(ctx, NOW());
  return { rew: q.rew };
}

// ---------------------------------------------------------------- ежедневные
var DAILY_TYPES = [
  { type: 'honey', stat: 'honeyMade' },
  { type: 'build', stat: ['built', 'upgraded'] },
  { type: 'hatch', stat: 'hatched' },
  { type: 'expedition', stat: 'expeditions' },
  { type: 'dance', stat: 'dances' }
];

function statValue(pd, stat) {
  if (Array.isArray(stat)) return stat.reduce(function (s, k) { return s + (pd.stats[k] || 0); }, 0);
  return pd.stats[stat] || 0;
}

function ensureDaily(ctx, now) {
  var pd = ctx.pd;
  var day = dayKey(now);
  if (pd.daily && pd.daily.day === day) return;
  var cfg = getCfg();
  var fl = computeFlows(ctx, now);
  var honeyRate = 0, waxRate = 0;
  fl.hives.forEach(function (f) { honeyRate += f.nhOut; waxRate += f.hwOut; });
  var rng = makeRng(ctx.player.id + ':' + day);
  var picks = shuffle(rng, DAILY_TYPES).slice(0, cfg.dailyCount);
  var rew = { honey: Math.max(60, Math.round(honeyRate)), wax: Math.max(30, Math.round(waxRate)) };
  pd.daily = {
    day: day, chest: false,
    quests: picks.map(function (d) {
      var target = 1;
      if (d.type === 'honey') target = Math.max(60, Math.round(honeyRate * 2.5 / 10) * 10);
      if (d.type === 'build') target = 3;
      if (d.type === 'hatch') target = 15;
      return { type: d.type, base: statValue(pd, d.stat), target: target, rew: rew, claimed: false };
    })
  };
}

function dailyView(ctx) {
  var pd = ctx.pd;
  if (!pd.daily) return null;
  return {
    day: pd.daily.day, chest: pd.daily.chest,
    quests: pd.daily.quests.map(function (q, i) {
      var d = DAILY_TYPES.filter(function (x) { return x.type === q.type; })[0];
      var prog = Math.min(q.target, Math.floor(statValue(pd, d.stat) - q.base));
      return { i: i, type: q.type, progress: prog, target: q.target, rew: q.rew, claimed: q.claimed, done: prog >= q.target };
    })
  };
}

function apiDailyClaim(ctx, req) {
  var v = dailyView(ctx);
  var q = v && v.quests[Number(req.i)];
  if (!q) throw gameErr('NOT_FOUND');
  if (q.claimed) throw gameErr('ALREADY');
  if (!q.done) throw gameErr('NOT_DONE');
  grant(ctx, q.rew, modsAt(NOW(), false).dailyReward);
  ctx.pd.daily.quests[q.i].claimed = true;
  return {};
}

function apiDailyChest(ctx) {
  var cfg = getCfg();
  var d = ctx.pd.daily;
  if (!d || d.chest) throw gameErr('ALREADY');
  if (!d.quests.every(function (q) { return q.claimed; })) throw gameErr('NOT_DONE');
  d.chest = true;
  refreshEnergy(ctx.pd, NOW());
  ctx.pd.energy = Math.min(cfg.energyMax, ctx.pd.energy + cfg.dailyChestEnergy);
  var amber = Math.random() < cfg.dailyChestAmberChance ? 1 : 0;
  ctx.pd.res.amber += amber;
  return { energy: cfg.dailyChestEnergy, amber: amber };
}

// ---------------------------------------------------------------- календарь входа
function touchLogin(ctx, now) {
  var lg = ctx.pd.login;
  var day = dayKey(now);
  if (lg.lastDay === day) return;
  lg.lastDay = day;
  lg.idx = (lg.idx + 1) % 7;   // пропуск дня не сбрасывает серию
  lg.claimable = true;
}

function apiLoginClaim(ctx) {
  var lg = ctx.pd.login;
  if (!lg.claimable) throw gameErr('ALREADY');
  var rew = getCfg().loginCalendar[lg.idx];
  grant(ctx, rew);
  lg.claimable = false;
  return { rew: rew };
}

// ---- Season.gs
/** Сезоны (неделя = сезон) и события дня. Раунд начинается в понедельник 00:00 МСК. */

var SEASON_EVENTS = {
  0: ['bloom_boom', 'first_flight', 'spring_rain'],
  1: ['hot_noon', 'fair', 'aphids'],
  2: ['leaf_fall', 'wasp_threat', 'honey_spas'],
  3: ['blizzard', 'hibernation', 'aurora']
};
var RAIN_WINDOW = [9, 15]; // часы МСК, когда идёт весенний ливень

function roundInfo() {
  var start = Number(roundGet('start', 0));
  var seed = roundGet('seed', 1);
  return { start: start, seed: seed, number: roundGet('number', 1) };
}

/** Последний понедельник 00:00 МСК не позже ts. */
function mondayStart(ts) {
  var msk = ts + 3 * HOUR;
  var d = new Date(msk);
  var dow = (d.getUTCDay() + 6) % 7; // 0 = понедельник
  var midnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - 3 * HOUR;
  return midnight - dow * DAY;
}

/** Расписание событий недели: [{dow, id}]. */
function weekEvents(week) {
  var r = roundInfo();
  var rng = makeRng(r.seed + ':week:' + week);
  var days = shuffle(rng, [1, 2, 3, 4, 5, 6]).slice(0, 3).sort();
  var ev = shuffle(rng, SEASON_EVENTS[week % 4]);
  return days.map(function (d, i) { return { dow: d, id: ev[i] }; });
}

/** Время раунда в момент t. */
function calendarAt(t) {
  var r = roundInfo();
  var days = Math.floor((t - r.start) / DAY);
  if (days < 0) days = 0;
  var week = Math.floor(days / 7);
  var dow = days % 7;
  var dayStart = r.start + days * DAY;
  var event = null;
  var evs = weekEvents(week);
  for (var i = 0; i < evs.length; i++) if (evs[i].dow === dow) event = evs[i].id;
  return { day: days, week: week, season: week % 4, dow: dow, dayStart: dayStart, event: event,
           hour: (t - dayStart) / HOUR };
}

/** Модификаторы экономики в момент t для улья (spring — есть ли родник рядом). */
function modsAt(t, spring) {
  var cfg = getCfg();
  var cal = calendarAt(t);
  var s = cfg.season[cal.season] || {};
  var m = {
    season: cal.season, event: cal.event,
    nectar: s.nectar || 1, propolis: s.propolis || 1, process: s.process || 1,
    upkeep: s.upkeep || 1, wax: s.wax || 1, buildCost: s.buildCost || 1,
    heat: s.heat ? 1 : 0, gatherBlocked: false, expSpeed: 1, expLoot: 1, dance: 1,
    dailyReward: 1
  };
  if (spring) m.upkeep *= cfg.springUpkeepBonus;
  switch (cal.event) {
    case 'bloom_boom': m.nectar *= 2; break;
    case 'first_flight': m.expSpeed *= 2; break;
    case 'spring_rain':
      if (cal.hour >= RAIN_WINDOW[0] && cal.hour < RAIN_WINDOW[1]) { m.gatherBlocked = true; m.wax *= 3; }
      break;
    case 'hot_noon': if (!spring) m.upkeep *= 1.5; break;
    case 'fair': m.dailyReward = 2; break;
    case 'leaf_fall': m.expLoot *= 1.5; break;
    case 'blizzard': m.expSpeed *= 0.5; m.heat *= 2; break;
    case 'hibernation': m.dance = cfg.danceHibernationMult; break;
  }
  return m;
}

/** Прогноз для клиента: события недели с датами + текущее состояние. */
function seasonForecast(now) {
  var r = roundInfo();
  var cal = calendarAt(now);
  var evs = weekEvents(cal.week).map(function (e) {
    return { id: e.id, dow: e.dow, start: r.start + (cal.week * 7 + e.dow) * DAY,
             end: r.start + (cal.week * 7 + e.dow + 1) * DAY };
  });
  var nextWeekStart = r.start + (cal.week + 1) * 7 * DAY;
  var tomorrow = calendarAt(now + DAY);
  return {
    round: r.number, roundStart: r.start, day: cal.day, week: cal.week, season: cal.season,
    dow: cal.dow, event: cal.event, events: evs, nextSeasonAt: nextWeekStart,
    tomorrowEvent: tomorrow.week === cal.week || tomorrow.dow !== 0 ? tomorrow.event : null,
    rainWindow: RAIN_WINDOW
  };
}

/** Временные объекты событий (тля, кристаллические цветы) — создаются один раз за событие. */
function ensureEventObjects(now) {
  var cal = calendarAt(now);
  if (cal.event !== 'aphids' && cal.event !== 'aurora') return;
  var key = 'spawned_' + cal.week + '_' + cal.event;
  if (roundGet(key, false)) return;
  var r = roundInfo();
  var rng = makeRng(r.seed + ':' + key);
  var n = getCfg().mapSize;
  var type = cal.event === 'aphids' ? 'aphids' : 'crystal';
  var count = type === 'aphids' ? 8 : 5;
  var until = cal.dayStart + DAY;
  var placed = 0;
  for (var tries = 0; tries < 500 && placed < count; tries++) {
    var x = rngInt(rng, 1, n - 2), y = rngInt(rng, 1, n - 2);
    var z = zoneOf(x, y);
    if (type === 'crystal' && z === 1) continue;
    var t = terrainAt(x, y);
    if (t === 'W' || t === 'R') continue;
    dbInsert('Map_Objects', { id: uid('e'), x: x, y: y, type: type, data: JSON.stringify({ until: until }) });
    placed++;
  }
  roundSet(key, true);
}

// ---- Social.gs
/** Капли мёда (сбор руками), цепочка целей после обучения, лента роёв, подарки и «ужалить». */

// ---------------------------------------------------------------- капли мёда
/** Капли копятся: одна раз в drops.everySec, не больше drops.max. */
function dropsRefresh(pd, now) {
  var c = getCfg().drops;
  var every = c.everySec * 1000;
  var d = pd.drops || (pd.drops = { n: c.start, t: now });
  if (d.n >= c.max) { d.t = now; return d; }
  var add = Math.floor((now - d.t) / every);
  if (add > 0) {
    d.n = Math.min(c.max, d.n + add);
    d.t = d.n >= c.max ? now : d.t + add * every;
  }
  return d;
}

/** Сколько даёт одна капля: drops.minutes работы котлов и воскотопок, но не меньше минимума. */
function dropReward(ctx, now) {
  var c = getCfg().drops;
  var fl = computeFlows(ctx, now), honey = 0, wax = 0;
  fl.hives.forEach(function (f) { honey += f.nhOut; wax += f.hwOut; });
  var k = c.minutes / 60;
  return { honey: Math.max(c.minHoney, Math.round(honey * k)), wax: Math.max(c.minWax, Math.round(wax * k)) };
}

function apiCollectDrop(ctx) {
  var now = NOW(), c = getCfg().drops;
  var d = dropsRefresh(ctx.pd, now);
  if (d.n < 1) throw gameErr('NO_DROPS');
  var rew = dropReward(ctx, now);
  if (d.n >= c.max) d.t = now; // таймер следующей капли пошёл с этого момента
  d.n--;
  grant(ctx, rew);
  ctx.pd.stats.drops = (ctx.pd.stats.drops || 0) + 1;
  return { rew: rew };
}

function dropsView(pd, now) {
  var c = getCfg().drops, d = dropsRefresh(pd, now);
  return { n: d.n, max: c.max, next: d.n >= c.max ? null : d.t + c.everySec * 1000 };
}

// ---------------------------------------------------------------- цепочка целей после обучения
var GOAL_KINDS = ['cells', 'bees', 'drops', 'upgrade', 'expedition', 'honey', 'cells', 'dance'];

function goalValue(ctx, kind) {
  var st = ctx.pd.stats, main = ctx.hives[0].hd;
  if (kind === 'cells') { var n = 0; ctx.hives.forEach(function (h) { n += countCells(h.hd, 1) + countCells(h.hd, 2); }); return n; }
  if (kind === 'bees') { var b = 0; for (var r in main.bees) b += main.bees[r]; return b; }
  if (kind === 'drops') return st.drops || 0;
  if (kind === 'upgrade') return st.upgraded || 0;
  if (kind === 'expedition') return st.expeditions || 0;
  if (kind === 'honey') return Math.floor(st.honeyMade || 0);
  if (kind === 'dance') return st.dances || 0;
  return 0;
}

/** Есть ли куда строить: свободные соты на открытых ярусах. */
function freeCells(ctx) {
  var hd = ctx.hives[0].hd, n = 0;
  for (var t = 1; t <= hd.tiers; t++) n += 36 - countCells(hd, t) - hd.jobs.filter(function (j) { return j.tier === t && j.kind === 'new'; }).length;
  return n;
}

/** Новая цель номер i. Цели идут по кругу, цифры растут вместе с ульем. */
function makeGoal(ctx, i, now) {
  var kind = null;
  for (var k = 0; k < GOAL_KINDS.length; k++) {
    var cand = GOAL_KINDS[(i + k) % GOAL_KINDS.length];
    if (cand === 'cells' && freeCells(ctx) < 2) continue;
    kind = cand; break;
  }
  var v = goalValue(ctx, kind), fl = computeFlows(ctx, now), honeyRate = 0, waxRate = 0;
  fl.hives.forEach(function (f) { honeyRate += f.nhOut; waxRate += f.hwOut; });
  var step = Math.floor(i / GOAL_KINDS.length); // каждый круг цели чуть больше
  var add = {
    cells: Math.min(2 + step, freeCells(ctx)), bees: 10 + step * 5, drops: 3, upgrade: 1 + Math.floor(step / 2),
    expedition: 1, honey: Math.max(100, Math.round(honeyRate * (1 + step * 0.5) / 10) * 10), dance: 1
  }[kind];
  var rew = { honey: Math.max(40, Math.round(honeyRate * 0.5)), wax: Math.max(25, Math.round(waxRate * 0.5)) };
  if ((i + 1) % 5 === 0) rew.amber = 1; // каждая пятая цель — янтарь
  return { i: i, kind: kind, target: v + add, add: add, rew: rew };
}

function ensureGoal(ctx, now) {
  var pd = ctx.pd;
  if (pd.goal || pd.tutorial.step < getCfg().tutorial.length) return;
  pd.goal = makeGoal(ctx, 0, now);
}

function goalView(ctx) {
  var g = ctx.pd.goal;
  if (!g) return null;
  var v = goalValue(ctx, g.kind);
  return { i: g.i, kind: g.kind, target: g.target, add: g.add, value: Math.min(v, g.target),
           from: g.target - g.add, rew: g.rew, met: v >= g.target };
}

function apiGoalClaim(ctx) {
  var now = NOW(), g = goalView(ctx);
  if (!g) throw gameErr('NOT_FOUND');
  if (!g.met) throw gameErr('NOT_DONE');
  grant(ctx, g.rew);
  ctx.pd.goal = makeGoal(ctx, g.i + 1, now);
  if ((g.i + 1) % 10 === 0) feedPush(ctx, 'goals', { n: g.i + 1 });
  return { rew: g.rew };
}

// ---------------------------------------------------------------- лента роёв
var FEED_SHEET = 'Feed';

/** Лист ленты создаётся сам: старые таблицы его не знают. */
function feedSheet() {
  var ss = getSS(), sh = ss.getSheetByName(FEED_SHEET);
  if (!sh) {
    sh = ss.insertSheet(FEED_SHEET);
    sh.getRange(1, 1, sh.getMaxRows(), SHEETS.Feed.length).setNumberFormat('@');
    sh.appendRow(SHEETS.Feed);
    sh.setFrozenRows(1);
  }
  return sh;
}

function feedPush(ctx, type, data, toId, ts) {
  var p = ctx.player;
  feedSheet();
  dbInsert(FEED_SHEET, { id: uid('f'), ts: ts || NOW(), pid: p.id, name: p.name, color: p.color, type: type, to: toId || '', data: JSON.stringify(data || {}) });
}

/** Подарки и уколы, которые прислали этому игроку, — доставляются при его следующем запросе. */
function processInbox(ctx) {
  var pd = ctx.pd, me = ctx.player.id, last = Number(pd.inboxTs) || (Number(ctx.player.createdAt) - 1) || 0, maxTs = last;
  feedSheet();
  dbTable(FEED_SHEET).forEach(function (r) {
    var ts = Number(r.ts);
    if (r.to !== me || ts <= last) return;
    maxTs = Math.max(maxTs, ts);
    var d = {}; try { d = JSON.parse(r.data || '{}'); } catch (e) {}
    if (r.type === 'gift') {
      grant(ctx, { honey: d.honey || 0, wax: d.wax || 0 });
      pushNotice(ctx, 'gift', { name: r.name, honey: d.honey || 0, wax: d.wax || 0 });
    } else if (r.type === 'sting') {
      pd.buffs = (pd.buffs || []).filter(function (b) { return b.until > NOW(); });
      pd.buffs.push({ type: 'sting', bonus: -getCfg().sting.penalty, from: NOW(), until: NOW() + getCfg().sting.hours * HOUR });
      pushNotice(ctx, 'sting', { name: r.name });
    }
  });
  pd.inboxTs = maxTs;
}

function socialDay(pd) {
  var day = dayKey(NOW());
  if (!pd.social || pd.social.day !== day) pd.social = { day: day, gift: false, sting: false };
  return pd.social;
}

function findPlayer(id) {
  return dbTable('Players').filter(function (p) { return p.id === id; })[0] || null;
}

function apiGift(ctx, req) {
  var so = socialDay(ctx.pd);
  if (so.gift) throw gameErr('ALREADY');
  var to = findPlayer(String(req.to || ''));
  if (!to || to.id === ctx.player.id) throw gameErr('NOT_FOUND');
  var g = getCfg().gift;
  so.gift = to.id;
  feedPush(ctx, 'gift', { honey: g.honey, wax: g.wax, toName: to.name, toColor: to.color }, to.id);
  return {};
}

function apiSting(ctx, req) {
  var so = socialDay(ctx.pd);
  if (so.sting) throw gameErr('ALREADY');
  var to = findPlayer(String(req.to || ''));
  if (!to || to.id === ctx.player.id) throw gameErr('NOT_FOUND');
  so.sting = to.id;
  feedPush(ctx, 'sting', { toName: to.name, toColor: to.color }, to.id);
  return {};
}

/** Вкладка «Рои»: рейтинг, лента и что я сегодня ещё могу. */
function apiSwarms(ctx) {
  feedSheet();
  var rows = dbTable(FEED_SHEET), feed = [];
  for (var i = rows.length - 1; i >= 0 && feed.length < 40; i--) {
    var r = rows[i], d = {};
    try { d = JSON.parse(r.data || '{}'); } catch (e) {}
    feed.push({ ts: Number(r.ts), name: r.name, color: r.color, type: r.type, data: d, me: r.pid === ctx.player.id, toMe: r.to === ctx.player.id });
  }
  var so = socialDay(ctx.pd);
  return {
    players: dbTable('Players').map(function (p) {
      return { id: p.id, name: p.name, color: p.color, glory: Number(p.glory) || 0, me: p.id === ctx.player.id };
    }).sort(function (a, b) { return b.glory - a.glory; }),
    feed: feed,
    gift: !so.gift, sting: !so.sting
  };
}

/** Общие утилиты: время, случайность по seed, гекс-сетка, ошибки. */

var _testNow = null; // в тестах подменяется

function NOW() { return _testNow !== null ? _testNow : Date.now(); }

var HOUR = 3600 * 1000;
var DAY = 24 * HOUR;

/** Ошибка игры с кодом для перевода на клиенте. */
function gameErr(code, params) {
  var e = new Error(code);
  e.isGame = true;
  e.code = code;
  e.params = params || {};
  return e;
}

/** Детерминированный генератор (mulberry32). */
function makeRng(seed) {
  var a = (typeof seed === 'number' ? seed : hashStr(String(seed))) >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  var h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function rngInt(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
function rngPick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(rng, arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function uid(prefix) {
  return (prefix || '') + NOW().toString(36) + Math.floor(Math.random() * 1e9).toString(36);
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function round2(v) { return Math.round(v * 100) / 100; }

/** Расстояние на карте (Чебышёв). */
function mapDist(x1, y1, x2, y2) { return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2)); }

// ---------------------------------------------------------------- гекс-сетка
// Ярус = 37 сот (радиус 3). Индекс 0 — центр, далее кольца 1, 2, 3.
var HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
var HEX = (function () {
  var cells = [{ q: 0, r: 0, ring: 0 }];
  for (var k = 1; k <= 3; k++) {
    var q = HEX_DIRS[4][0] * k, r = HEX_DIRS[4][1] * k;
    for (var i = 0; i < 6; i++) {
      for (var j = 0; j < k; j++) {
        cells.push({ q: q, r: r, ring: k });
        q += HEX_DIRS[i][0]; r += HEX_DIRS[i][1];
      }
    }
  }
  var byKey = {};
  for (var n = 0; n < cells.length; n++) byKey[cells[n].q + ',' + cells[n].r] = n;
  for (var m = 0; m < cells.length; m++) {
    var nb = [];
    for (var d = 0; d < 6; d++) {
      var key = (cells[m].q + HEX_DIRS[d][0]) + ',' + (cells[m].r + HEX_DIRS[d][1]);
      if (byKey[key] !== undefined) nb.push(byKey[key]);
    }
    cells[m].nb = nb;
  }
  return cells;
})();

function sumObj(a, b, mult) {
  var out = {};
  var k;
  for (k in a) out[k] = a[k];
  for (k in b) out[k] = (out[k] || 0) + b[k] * (mult === undefined ? 1 : mult);
  return out;
}

function scaleCost(cost, m) {
  var out = {};
  for (var k in cost) out[k] = Math.ceil(cost[k] * m);
  return out;
}

/** Ключ дня по московскому времени (UTC+3, без перехода на летнее время). */
function dayKey(ts) {
  var d = new Date(ts + 3 * HOUR);
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}

let LANG = localStorage.getItem('mh_lang') || 'ru';
function T(key, ...args) {
  const v = (I18N[LANG] && I18N[LANG][key]) ?? I18N.ru[key];
  if (typeof v === 'function') return v(...args);
  return v ?? key;
}
function TE(code, params) {
  const v = I18N[LANG].err[code] ?? I18N.ru.err[code];
  if (typeof v === 'function') return v(params || {});
  return v || code;
}
function applyStaticTexts() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  document.documentElement.lang = LANG;
}

// ---------------------------------------------------------------- 3D: улей на пне, поляна, пчёлы
const Scene3D = (() => {
  const CELL_R = 0.5, SQ3 = Math.sqrt(3), GAP = 2.2, WALL_H = 0.3, STUMP_TOP = 0;
  const HEXQ = (() => { // те же индексы, что на сервере
    const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    const cells = [{ q: 0, r: 0, ring: 0 }];
    for (let k = 1; k <= 3; k++) {
      let q = dirs[4][0] * k, r = dirs[4][1] * k;
      for (let i = 0; i < 6; i++) for (let j = 0; j < k; j++) { cells.push({ q, r, ring: k }); q += dirs[i][0]; r += dirs[i][1]; }
    }
    return cells;
  })();
  const pos = (idx) => { const c = HEXQ[idx]; return [CELL_R * SQ3 * (c.q + c.r / 2), CELL_R * 1.5 * c.r]; };
  const tierY = (t) => STUMP_TOP + (t - 1) * GAP;

  const QUAL = {
    high: { dpr: 1.75, shadow: 2048, grass: 15000, shells: 2, flowers: 380, bees: 24, grassShadow: true },
    mid: { dpr: 1.35, shadow: 1024, grass: 8500, shells: 1, flowers: 240, bees: 16, grassShadow: false },
    low: { dpr: 1, shadow: 1024, grass: 3500, shells: 0, flowers: 120, bees: 10, grassShadow: false }
  };
  let Q = QUAL.high, qName = 'high';
  let renderer, scene, camera, controls, canvas, raycaster, pointer, sun, getNow = () => Date.now();
  let tierGroups = [], pickers = [], anims = [], halo, activeTier = 1, paused = false;
  let grassMesh = null;
  let grassMat = null, prevCellKeys = null, jobsNow = [], hiveData = null, haloFill = null;
  const api = { onCellTap: null };
  const clock = { t: 0, last: performance.now() };

  // ================================================================ шум и текстуры
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); a *= 0.5; f *= 2.03; } return s; };
  const rnd = (s) => hash(s, s * 0.37 + 11.3);

  function canvasTex(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
    return t;
  }
  /** Карта нормалей из высот (функция f(x,y) -> 0..1). */
  function normalTex(w, h, f, strength = 2, repeat) {
    return canvasTex(w, h, (g) => {
      const img = g.createImageData(w, h), hgt = new Float32Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) hgt[y * w + x] = f(x / w, y / h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const l = hgt[y * w + (x + w - 1) % w], r = hgt[y * w + (x + 1) % w], u = hgt[((y + h - 1) % h) * w + x], d = hgt[((y + 1) % h) * w + x];
        let nx = (l - r) * strength, ny = (u - d) * strength, nz = 1; const len = Math.hypot(nx, ny, nz);
        const i = (y * w + x) * 4;
        img.data[i] = (nx / len * 0.5 + 0.5) * 255; img.data[i + 1] = (ny / len * 0.5 + 0.5) * 255; img.data[i + 2] = (nz / len * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }, { data: true, repeat });
  }

  // ================================================================ материалы
  const M = {};
  function makeMaterials() {
    const std = (o) => new THREE.MeshStandardMaterial(o);
    const phys = (o) => new THREE.MeshPhysicalMaterial(o);
    const waxN = normalTex(128, 128, (x, y) => fbm(x * 9, y * 9, 3), 3);
    M.wax = std({ color: '#E3A12C', roughness: 0.38, normalMap: waxN, normalScale: new THREE.Vector2(0.35, 0.35), emissive: '#5A2E00', emissiveIntensity: 0.12 });

  // ================================================================ инициализация
  async function init(cv, nowFn, quality) {
    canvas = cv; getNow = nowFn || getNow;
    qName = QUAL[quality] ? quality : 'high'; Q = QUAL[qName];
    renderer = new THREE.WebGLRenderer({ canvas, antialias: qName !== 'low', alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(Q.dpr, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = qName === 'low' ? THREE.PCFShadowMap : THREE.VSMShadowMap;
    renderer.shadowMap.autoUpdate = false; // тени статичны: перерисовываем карту теней только когда меняется улей
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    scene = new THREE.Scene();
    const HORIZON = new THREE.Color('#CFE6EE');
    scene.background = HORIZON;
    scene.fog = new THREE.Fog(HORIZON, 26, 78);
    camera = new THREE.PerspectiveCamera(45, 1, 0.3, 400);
    camera.position.set(0, 7.2, 9.6);
    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
    controls.minDistance = 5; controls.maxDistance = 16;
    controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.32;
    controls.rotateSpeed = 0.7; controls.zoomSpeed = 0.8;
    controls.target.set(0, 0.3, 0.9);
    try {
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.3;
    } catch (e) {}
    makeMaterials();
    // свет
    scene.add(new THREE.HemisphereLight('#DCEEFF', '#5A7A30', 0.75));
    sun = new THREE.DirectionalLight('#FFE9C4', 2.3);
    sun.position.set(7, 13, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(Q.shadow, Q.shadow);
    Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 6; sun.shadow.blurSamples = 16;
    scene.add(sun); scene.add(sun.target);
    const fill = new THREE.DirectionalLight('#BFD8FF', 0.5); fill.position.set(-8, 6, -5); scene.add(fill);

    buildSky(); buildGround(); buildStump(); buildGrass(); buildFlowers(); buildTrees(); buildClouds(); buildDecor();
    for (let t = 1; t <= 3; t++) { const g = new THREE.Group(); g.position.y = tierY(t); scene.add(g); tierGroups[t] = g; }
    halo = new THREE.Mesh(new THREE.RingGeometry(CELL_R * 0.82, CELL_R * 1.0, 6, 1), M.select);
    halo.rotation.x = -Math.PI / 2; halo.rotation.z = Math.PI / 6; halo.visible = false; halo.renderOrder = 5;
    haloFill = new THREE.Mesh(new THREE.CircleGeometry(CELL_R * 0.84, 6), new THREE.MeshBasicMaterial({ color: '#FFF6C9', transparent: true, opacity: 0.2, depthWrite: false, toneMapped: false, side: THREE.DoubleSide }));
    haloFill.position.z = -0.01; halo.add(haloFill);
    scene.add(halo);
    Particles.init(); Bees.init(Q.bees, Q.shells); Butterflies.init(4); Pollen.init(110); Drops.init();
    raycaster = new THREE.Raycaster(); pointer = new THREE.Vector2();
    let down = null;
    canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; idleAt = performance.now(); });
    canvas.addEventListener('pointerup', e => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      if (moved < 16 && performance.now() - down.t < 700) tap(e);
      down = null;
    });
    // если телефон отобрал у страницы графику (свернули надолго) — перезапускаем сцену
    canvas.addEventListener('webglcontextlost', e => e.preventDefault());

  }

  // ================================================================ окружение
  function buildSky() {
    const geo = new THREE.SphereGeometry(300, 32, 16);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { sunDir: { value: new THREE.Vector3(7, 13, 6).normalize() } },
      vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix * vec4(position,1.)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.); }',
      fragmentShader: `uniform vec3 sunDir; varying vec3 vW;
        void main(){ vec3 d = normalize(vW); float h = d.y;
          vec3 zen = vec3(0.30,0.58,0.86), hor = vec3(0.81,0.90,0.93), warm = vec3(1.0,0.93,0.80);
          vec3 col = mix(hor, zen, pow(clamp(h,0.,1.), 0.55));
          float s = max(dot(d, sunDir), 0.);
          col = mix(col, warm, pow(s, 4.) * 0.35) + vec3(1.,0.95,0.8) * pow(s, 400.) * 1.2;
          if (h < 0.) col = hor;
          gl_FragColor = vec4(col, 1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    const sky = new THREE.Mesh(geo, mat); sky.renderOrder = -10; sky.frustumCulled = false;
    scene.add(sky);
  }

  function groundHeight(x, z) {
    const r = Math.hypot(x, z);
    const hills = (fbm(x * 0.05 + 3, z * 0.05 + 7, 3) - 0.5) * 2.2 * Math.min(1, Math.max(0, (r - 9) / 18));
    const far = Math.max(0, r - 34) * 0.06 * (0.6 + fbm(x * 0.02, z * 0.02, 2));
    return hills + far * far * 0.6 - 1.25; // поляна ниже среза пня: улей стоит на пне
  }
  function buildGround() {
    const geo = new THREE.RingGeometry(0.01, 110, 140, 70);
    geo.rotateX(-Math.PI / 2);
    // сгущаем вершины к центру
    const p = geo.attributes.position, col = [];
    const cA = new THREE.Color('#5E9A36'), cB = new THREE.Color('#78B043'), cC = new THREE.Color('#4A8530'), cD = new THREE.Color('#8FB952'), dirt = new THREE.Color('#7A5A36');
    const tmp = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), z = p.getZ(i); const r = Math.hypot(x, z);
      if (r > 0.01) { const k = Math.pow(r / 110, 1.7) * 110 / r; x *= k; z *= k; p.setX(i, x); p.setZ(i, z); }
      const rr = Math.hypot(x, z);
      p.setY(i, groundHeight(x, z) - 0.02);
      const n = fbm(x * 0.12, z * 0.12, 4), n2 = fbm(x * 0.5 + 9, z * 0.5, 2);
      tmp.copy(cA).lerp(cB, n).lerp(cC, Math.max(0, n2 - 0.55) * 1.6).lerp(cD, Math.max(0, fbm(x * .07 + 40, z * .07) - 0.6) * 2);
      const d = Math.max(0, 1 - Math.abs(rr - 3.7) / 1.3) * (0.55 + n2 * 0.4);
      tmp.lerp(dirt, d);
      col.push(tmp.r, tmp.g, tmp.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.computeVertexNormals();
    const grassTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#E6E6E6'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 1400; i++) {
        const x = rnd(i + 2000) * w, y = rnd(i + 2001) * h, len = 5 + rnd(i + 2002) * 9, an = rnd(i + 2003) * 6.28, l = rnd(i + 2004);
        g.strokeStyle = l > 0.5 ? `rgba(255,255,220,${0.25 + l * 0.3})` : `rgba(20,60,10,${0.2 + l * 0.5})`; g.lineWidth = 1 + rnd(i + 2005) * 1.6; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(an) * len * 0.5 + 2, y + Math.sin(an) * len * 0.5 - 2, x + Math.cos(an) * len, y + Math.sin(an) * len); g.stroke();
      }
    }, { repeat: [46, 46] });
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, map: grassTex,
      normalMap: normalTex(128, 128, (x, y) => fbm(x * 16, y * 16, 3), 2, [40, 40]), normalScale: new THREE.Vector2(0.6, 0.6) });
    const g = new THREE.Mesh(geo, mat); g.receiveShadow = true;
    scene.add(g);
    // дальние холмы
    const hillMat = new THREE.MeshStandardMaterial({ color: '#7FA968', roughness: 1 });
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2 + rnd(i) * 0.3, r = 62 + rnd(i + 5) * 18;
      const hm = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), hillMat);
      hm.scale.set(14 + rnd(i + 2) * 12, 6 + rnd(i + 3) * 8, 10 + rnd(i + 4) * 8);
      hm.position.set(Math.cos(a) * r, -2 + groundHeight(Math.cos(a) * r, Math.sin(a) * r) * 0.3, Math.sin(a) * r);
      hm.rotation.y = -a;
      scene.add(hm);
    }
  }

  function buildStump() {
    const g = new THREE.Group();
    // кора: профиль вращения с расширением к корням
    const prof = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, y = -0.25 - (1 - t) * 3.2;
      const r = 3.45 + Math.pow(1 - t, 3) * 1.3 - Math.sin(t * Math.PI) * 0.12;
      prof.push(new THREE.Vector2(r, y));
    }
    prof.push(new THREE.Vector2(3.42, -0.18));
    const geo = new THREE.LatheGeometry(prof, 72);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i), a = Math.atan2(z, x);
      const k = 1 + (Math.sin(a * 23 + Math.sin(y * 2) * 0.6) * 0.012 + (fbm(a * 3 + 10, y * 0.8, 3) - 0.5) * 0.07);
      p.setX(i, x * k); p.setZ(i, z * k);
    }
    geo.computeVertexNormals();
    const bark = new THREE.Mesh(geo, M.bark); bark.castShadow = true; bark.receiveShadow = true; g.add(bark);
    // срез с годовыми кольцами
    const top = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.08, 72), [M.bark, M.rings, M.rings]);
    top.position.y = -0.22; top.receiveShadow = true; g.add(top);
    // корни
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2 + rnd(i + 80) * 0.4;
      const pts = [];
      for (let k = 0; k <= 6; k++) { const t = k / 6, r = 3.3 + t * (2 + rnd(i + 81) * 1.6); pts.push(new THREE.Vector3(Math.cos(a + t * 0.25) * r, -0.7 - t * 0.85 + Math.sin(t * Math.PI) * 0.22, Math.sin(a + t * 0.25) * r)); }
      const root = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.38, 8, false), M.bark);
      root.castShadow = true; root.receiveShadow = true;
      // сужение к концу
      const pos2 = root.geometry.attributes.position, curve = root.geometry.parameters.path;
      for (let k = 0; k < pos2.count; k++) {
        const seg = Math.floor(k / 9) / 16, c = curve.getPoint(Math.min(1, seg)), s = 1 - seg * 0.75;
        pos2.setXYZ(k, c.x + (pos2.getX(k) - c.x) * s, c.y + (pos2.getY(k) - c.y) * s, c.z + (pos2.getZ(k) - c.z) * s);
      }
      root.geometry.computeVertexNormals();
      g.add(root);
    }
    g.position.y = STUMP_TOP;
    scene.add(g);
  }

  function buildGrass() {
    // Лист-дуга: широкий у основания, сильно выгнут наружу — хорошо читается и сбоку, и сверху.
    const N = Q.grass;
    const geo = new THREE.BufferGeometry();
    const segs = 5, verts = [], cols = [], norms = [], idx = [];
    const base = new THREE.Color('#1F4F18'), mid = new THREE.Color('#5FA83A'), tip = new THREE.Color('#C4E67A');
    for (let i = 0; i <= segs; i++) {
      const t = i / segs, w = 0.5 * Math.sin(Math.min(1, t * 1.6 + 0.25) * Math.PI * 0.5) * (1 - Math.pow(t, 2.2));
      const y = Math.sin(t * Math.PI * 0.5), z = (1 - Math.cos(t * Math.PI * 0.5)) + t * t * 0.25; // дуга: вверх, потом наружу и вниз
      verts.push(-w, y, z, w, y, z);
      const c = t < 0.5 ? base.clone().lerp(mid, t * 2) : mid.clone().lerp(tip, (t - 0.5) * 2);
      cols.push(c.r, c.g, c.b, c.r, c.g, c.b);
      norms.push(-0.25, 0.9, 0.3, 0.25, 0.9, 0.3); // нормали вверх: лист освещён ровно, без чёрных изнанок
      if (i < segs) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
    geo.setIndex(idx);
    grassMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    grassMat.onBeforeCompile = (sh) => {
      sh.uniforms.uTime = { value: 0 };
      grassMat.userData.sh = sh;
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', `
        vec4 mvPosition = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
        #endif
        float hh = position.y * position.y;
        // порывы ветра бегут по поляне волнами — их видно и с высоты
        float gust = sin(uTime * 1.3 - mvPosition.x * 0.22 - mvPosition.z * 0.15);
        float wv = gust * 0.75 + sin(uTime * 2.9 + mvPosition.x * 1.1 + mvPosition.z * 0.8) * 0.25;
        mvPosition.x += (0.06 + wv * 0.11) * hh; mvPosition.z += (0.03 + wv * 0.06) * hh; mvPosition.y -= max(0.0, wv) * 0.03 * hh;
        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;`);
      // лист виден с обеих сторон, а освещаться должен одинаково: не переворачиваем нормаль у изнанки
      sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\n  normal = normalize( vNormal );');
    };
    const mesh = new THREE.InstancedMesh(geo, grassMat, N);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
    let n = 0, guard = 0;
    while (n < N && guard++ < N) {
      // кочка: 5–8 листьев розеткой во все стороны
      const u = Math.random(), r = 3.75 + Math.pow(u, 1.5) * 24, a = Math.random() * Math.PI * 2;
      const cx = Math.cos(a) * r, cz = Math.sin(a) * r;
      const dens = fbm(cx * 0.25, cz * 0.25, 2);
      if (dens < 0.3 && Math.random() < 0.6) continue;
      const blades = 5 + Math.floor(Math.random() * 4), yaw0 = Math.random() * 7, tuftH = (0.2 + Math.random() * 0.22) * (0.75 + dens * 0.6);
      const hue = 0.23 + (Math.random() - 0.5) * 0.07, lum = 0.4 + Math.random() * 0.14 + dens * 0.08;

  if (s < 3600) { const m = Math.floor(s / 60), r = s % 60; return r && m < 10 ? `${m}${u[1]} ${r}${u[0]}` : `${Math.ceil(s / 60)}${u[1]}`; }

  const d = Math.floor(s / 86400), h = Math.round((s % 86400) / 3600);

}

function costNew(b, tier) { const c = cfg(); return scaleCost(c.buildings[b].cost, Math.pow(c.growthNew[tier], hive().k[tier]) * S.seasonCostMult); }

function timeBase(tier, k) { const c = cfg(); return Math.min(c.maxBuildSec, Math.round(c.timeBaseNewSec[tier] * Math.pow(c.timeGrowth[tier], k))); }
function timeNew(tier, k) { const sp = (cfg().newBuildSpeed || {})[tier] || 1; return sp === 1 ? timeBase(tier, k) : Math.max(4, Math.round(timeBase(tier, k) / sp)); }
function costUpg(b, to) { const c = cfg(); return scaleCost(c.buildings[b].cost, c.upgCostMult[to] * S.seasonCostMult); }
function timeUpg(tier, to) { const c = cfg(); return Math.round(Math.min(c.maxBuildSec, Math.max(c.minUpgSecPerTier * tier, timeBase(tier, hive().count[tier] || 0) * c.upgTimeMult[to]))); }

function neighbors(tier, idx) {

  return out.map(([t, i]) => hive().cells.find(c => c.tier === t && c.idx === i)).filter(Boolean);
}

// ================================================================ действия из панелей
async function act(el) {
  const a = el.dataset.act, d = el.dataset;
  el.classList.remove('press'); void el.offsetWidth; el.classList.add('press');
  switch (a) {
    case 'planNew': {
      const r = doAction('planNew', { tier: +d.tier, idx: +d.idx, b: d.b });
      if (!r) return;
      closeSheet();
      const started = hive().jobs.some(j => j.id === r.id);
      toast(started ? T('started_build') : T('added_to_plan'), 'good');
      Scene3D.celebrate(+d.tier, +d.idx, 'place');
      Coach.onEvent('planNew', d.b);
      break;
    }
    case 'buildCat': buildCat = d.g; refreshSheet(); break;
    case 'planUpgrade': if (doAction('planUpgrade', { tier: +d.tier, idx: +d.idx })) Scene3D.celebrate(+d.tier, +d.idx, 'place'); break;
    case 'planGate': if (doAction('planGate')) Scene3D.celebrate(1, 0, 'place'); break;
    case 'planCancel': doAction('planCancel', { id: d.id }); break;
    case 'planMove': doAction('planMove', { id: d.id, dir: d.dir }); break;
    case 'jobCancel': doAction('jobCancel', { id: d.id }); break;
    case 'unlockTier': if (doAction('unlockTier')) { setActiveTier(2); closeSheet(); confetti(window.innerWidth / 2, window.innerHeight / 2); haptic('big'); } break;
    case 'hatchRole': hatchRole = d.role; refreshSheet(); break;
    case 'hatchN': hatchN = Math.max(1, hatchN + (+d.d)); refreshSheet(); break;
    case 'hatchMax': {
      const h = hive(), pop = Object.values(h.bees).reduce((x, y) => x + y, 0) + h.hatchQ.reduce((x, y) => x + y.n, 0);
      hatchN = Math.max(1, Math.min(h.prof.house - pop, Math.floor((S.res.honey || 0) / cfg().beeCost[hatchRole])));
      if (hatchRole === 'lookout') hatchN = Math.max(1, Math.min(hatchN, h.prof.lookoutCap - h.bees.lookout));
      refreshSheet(); break;
    }
    case 'hatch': if (doAction('hatch', { role: hatchRole, n: hatchN })) { toast(L(`В колыбели: ${hatchN}`, `Hatching: ${hatchN}`), 'good'); Scene3D.celebrate(1, 0, 'hatch'); } break;
    case 'hatchCancel': doAction('hatchCancel'); break;
    case 'pshare': doAction('propolisShare', { share: +d.v }); break;
    case 'sFrom': school.from = d.role; refreshSheet(); break;
    case 'sTo': school.to = d.role; refreshSheet(); break;
    case 'sN': school.n = Math.max(1, school.n + (+d.d)); refreshSheet(); break;
    case 'retrain': if (doAction('retrain', { from: school.from, to: school.to, n: school.n })) toast(L('Пчёлы переучены', 'Bees retrained'), 'good'); break;
    case 'goBees': closeSheet(); setTimeout(beesSheet, 150); break;
    case 'goMap': closeSheet(); setView('map'); break;
    case 'expL': { const h = hive(); expL = Math.max(1, Math.min(h.bees.lookout - h.away.lookout, expL + (+d.d))); refreshSheet(); break; }
    case 'expF': { const h = hive(); expF = Math.max(0, Math.min(h.bees.forager - h.away.forager, expF + (+d.d))); refreshSheet(); break; }
    case 'expSend': if (doAction('expSend', { x: mapSel.x, y: mapSel.y, lookouts: expL, foragers: expF })) { toast(T('exp_sent'), 'good'); closeSheet(); MapView.clearSel(); } break;
    case 'openChoice': { const e = S.exps.find(x => x.id === d.id); if (e) openChoice(e); break; }
    case 'tutorialClaim': claimWith(el, () => doAction('tutorialClaim'), S.tutorial.rew); break;
    case 'goalClaim': claimWith(el, () => doAction('goalClaim'), S.goal.rew); break;
    case 'gift': case 'sting': {
      el.disabled = true;
      try {
        await serverAction(a, { to: d.id });
        SW = await serverAction('swarms', {}, { silent: true });
        toast(T(a === 'gift' ? 'gift_done' : 'sting_done'), 'good'); haptic('big');
        if (a === 'gift') confetti(el);
        refreshSheet();
      } catch (e) { el.disabled = false; }
      break;
    }
    case 'dailyClaim': claimWith(el, () => doAction('dailyClaim', { i: +d.i }), (S.daily.quests.find(q => q.i === +d.i) || {}).rew); break;
    case 'loginClaim': { const lg = S.login; claimWith(el, () => doAction('loginClaim'), cfg().loginCalendar[lg.idx]); break; }
    case 'dailyChest': {
      el.disabled = true;
      try { const r = await serverAction('dailyChest'); confetti(el); flyRewards(el, { amber: r.amber || 0 }); if (r.amber) toast('+1 ' + T('res_amber').toLowerCase(), 'good'); } catch (e) {}
      break;
    }
    case 'forecast': openSheet({ kind: 'forecast', title: T('season_forecast'), render: forecastHtml }); break;
    case 'cocoon': toast(T('cocoon_d')); break;
    case 'expeditions': expeditionsSheet(); break;
    case 'lang': LANG = d.lang; localStorage.setItem('mh_lang', LANG); applyStaticTexts(); buildNav(); doAction('setLang', { lang: d.lang }); break;
    case 'quality': setQuality(d.q); refreshSheet(); break;
    case 'replay': closeSheet(); Coach.start(true); break;
    case 'logout': logoutLocal(); break;
  }
}
