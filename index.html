<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Мега-Рой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
/* Мега-Рой — интерфейс. Структура, типографика, радиусы и единственный уровень тени —
   по дизайн-языку Airbnb (DESIGN.md); единственный акцент — медовый вместо Rausch. */
:root {
  --canvas: #FFFFFF; --ink: #222222; --body: #3F3F3F; --muted: #6A6A6A; --muted-soft: #929292;
  --hairline: #DDDDDD; --hairline-soft: #EBEBEB; --surface-soft: #F7F7F7; --surface-strong: #F2F2F2;
  --primary: #FFB000; --primary-active: #F29D00; --primary-disabled: #FFE6A3; --on-primary: #222222;
  --primary-soft: #FFF4D6; --error: #C13515; --good: #1F7A3A; --good-soft: #E6F4EA;
  --r-xs: 4px; --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 32px; --r-full: 9999px;
  --shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  --font: Inter, 'Airbnb Cereal VF', Circular, -apple-system, system-ui, Roboto, 'Helvetica Neue', sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #CFE6F2; color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

.ic { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }
.ui-ic { width: 20px; height: 20px; flex: none; }
.nav-ic { width: 24px; height: 24px; }
.b-ic { width: 40px; height: 40px; flex: none; }
.role-ic { width: 40px; height: 40px; flex: none; }

/* ---------- загрузка */
#loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: linear-gradient(180deg, #DDF0FA 0%, #FFF7E0 100%); }
.load-bee { width: 96px; height: 96px; animation: hover 1.6s ease-in-out infinite; }
.load-bee svg { width: 100%; height: 100%; }
.load-text { font-weight: 600; color: var(--body); }
.load-bar { width: 140px; height: 4px; border-radius: var(--r-full); background: rgba(0,0,0,.08); overflow: hidden; }
.load-bar i { display: block; height: 100%; width: 40%; border-radius: inherit; background: var(--primary); animation: slide 1.1s var(--ease) infinite; }
@keyframes hover { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* ---------- кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--r-sm);
  font-size: 16px; font-weight: 500; line-height: 1.25; background: var(--canvas); color: var(--ink); border: 1px solid var(--ink);
  transition: transform .12s var(--ease), background .15s; user-select: none; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); border-color: transparent; color: var(--on-primary); font-weight: 600; }
.btn.primary:active { background: var(--primary-active); }
.btn.primary:disabled { background: var(--primary-disabled); color: rgba(34,34,34,.45); }
.btn:disabled { opacity: 1; border-color: var(--hairline); color: var(--muted-soft); cursor: not-allowed; transform: none; }
.btn.ghost { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; height: 40px; padding: 0 8px; }
.btn.small { height: 36px; padding: 0 14px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn.big { height: 56px; font-size: 17px; }
.btn .cost { margin-left: 2px; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-full); background: var(--surface-strong); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn .ui-ic { width: 18px; height: 18px; }
.icon-btn:active { transform: scale(.92); }
.press { animation: press .28s var(--spring); }
@keyframes press { 0% { transform: scale(1); } 40% { transform: scale(.94); } 100% { transform: scale(1); } }

/* ---------- вход */
#auth { position: fixed; inset: 0; overflow-y: auto; background: var(--canvas); padding: calc(var(--safe-t) + 8px) 24px calc(var(--safe-b) + 24px); }
.auth-top { display: flex; justify-content: flex-end; }
.lang-switch { display: inline-flex; background: var(--surface-strong); border-radius: var(--r-full); padding: 3px; }
.lang-switch button { height: 30px; padding: 0 12px; border-radius: var(--r-full); font-size: 13px; font-weight: 600; color: var(--muted); }
.lang-switch button.on { background: var(--canvas); color: var(--ink); box-shadow: var(--shadow); }
.auth-hero { text-align: center; margin: 8px 0 24px; }
.auth-bee { width: 112px; height: 112px; animation: hover 2.2s ease-in-out infinite; }
.auth-hero h1 { font-size: 28px; font-weight: 700; line-height: 1.2; margin: 8px 0 6px; letter-spacing: -.4px; }
.tagline { color: var(--muted); font-size: 15px; margin: 0 auto; max-width: 30ch; }
.auth-card { max-width: 420px; margin: 0 auto; }
.seg { display: flex; background: var(--surface-strong); border-radius: var(--r-full); padding: 4px; margin-bottom: 20px; }
.seg button { flex: 1; height: 40px; border-radius: var(--r-full); font-weight: 600; color: var(--muted); font-size: 15px; transition: background .2s, color .2s; }
.seg button.on { background: var(--canvas); color: var(--ink); box-shadow: var(--shadow); }
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; height: 56px; border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 0 14px; background: var(--canvas); font-size: 16px; outline: none; }
.field input:focus { border: 2px solid var(--ink); padding: 0 13px; }
.field input.pin { letter-spacing: 14px; font-size: 22px; font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: var(--r-full); position: relative; transition: transform .15s var(--spring); }
.swatch.on { transform: scale(1.12); box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5px var(--ink); }
.swatch:disabled { opacity: .2; }
.chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.char { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px 8px; text-align: center; transition: border .15s; }
.char b { display: block; font-size: 14px; font-weight: 600; }
.char small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.char.on { border: 2px solid var(--ink); padding: 11px 7px; }

/* ---------- игра */
#game { position: fixed; inset: 0; }
#scene, #mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#mapCanvas { background: #E9E2CF; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }

#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 10px) 12px 0; z-index: 5; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-row { display: flex; align-items: center; gap: 8px; }
.hud-row.chips { margin-top: 8px; flex-wrap: wrap; pointer-events: none; padding-right: 84px; }
.hud-row.chips > * { pointer-events: auto; }
.avatar { width: 44px; height: 44px; border-radius: var(--r-full); flex: none; box-shadow: var(--shadow); border: 3px solid var(--canvas);
  display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.resbar { flex: 1; display: flex; align-items: center; background: var(--canvas); border-radius: var(--r-full); box-shadow: var(--shadow); height: 44px; padding: 0 6px; min-width: 0; }
.res { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 100%; min-width: 0; position: relative; }
.res + .res::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--hairline-soft); }
.res .ic { width: 22px; height: 22px; }
.res .v { font-size: 14px; font-weight: 600; letter-spacing: -.2px; }
.res.full .v { color: var(--error); }
.res.bump .v { animation: bump .45s var(--spring); }
@keyframes bump { 40% { transform: scale(1.25); color: var(--good); } }
.res.spend .v { animation: spend .45s var(--ease); }
@keyframes spend { 40% { transform: scale(.85); color: var(--error); } }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-full); background: rgba(255,255,255,.92);
  box-shadow: var(--shadow); font-size: 13px; font-weight: 500; color: var(--ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
.chip .ui-ic { width: 16px; height: 16px; }
.chip.warn { background: var(--primary-soft); }
.chip.alert { background: #FDE8E4; color: var(--error); }
.goal { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 12px 5px 6px; min-height: 36px; border-radius: var(--r-md);
  background: rgba(255,255,255,.95); box-shadow: var(--shadow); text-align: left; animation: dropIn .4s var(--spring); }
.goal .g-ic { width: 26px; height: 26px; border-radius: var(--r-sm); background: var(--primary-soft); display: flex; align-items: center; justify-content: center; flex: none; }
.goal .g-ic svg { width: 18px; height: 18px; }
.goal .g-t { font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.goal .g-d { font-size: 13px; font-weight: 500; line-height: 1.3; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal .grow { min-width: 0; }
.goal { border-radius: var(--r-full) !important; }
.goal.ready { background: var(--primary); }
.goal.ready .g-t { color: rgba(34,34,34,.7); }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } }

.tiers { position: absolute; right: 12px; top: calc(var(--safe-t) + 62px); z-index: 6; display: flex; background: var(--canvas);
  border-radius: var(--r-full); box-shadow: var(--shadow); padding: 3px; gap: 2px; }
.tiers button { width: 34px; height: 34px; border-radius: var(--r-full); font-weight: 600; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.tiers button.on { background: var(--ink); color: #fff; }
.tiers button.locked { color: var(--muted-soft); }
.tiers button.locked .ui-ic { width: 16px; height: 16px; }

.map-ctl { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.map-ctl button { width: 44px; height: 44px; border-radius: var(--r-full); background: var(--canvas); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }

#bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; }
#bottom > * { pointer-events: auto; }
.bottom-row { display: flex; align-items: flex-end; gap: 10px; padding: 0 12px 10px; pointer-events: none; }
.bottom-row > * { pointer-events: auto; }
.build-card { flex: 1; min-width: 0; background: var(--canvas); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.build-card:active { transform: scale(.985); }
.bc-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bc-row .b-ic { width: 32px; height: 32px; }
.bc-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bc-plan { font-size: 12px; font-weight: 600; background: var(--surface-strong); border-radius: var(--r-full); padding: 2px 8px; color: var(--body); flex: none; }
.bc-idle { display: flex; align-items: center; gap: 10px; }
.bc-idle .hint { font-size: 13px; color: var(--muted); line-height: 1.3; }
.bc-idle b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.bar { height: 6px; border-radius: var(--r-full); background: var(--surface-strong); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width 1s linear; }
.bar.green i { background: #3FA34D; }
.bar.lilac i { background: #A57FE0; }

.dance-fab { margin-left: auto; width: 64px; height: 64px; flex: none; border-radius: var(--r-full); background: var(--canvas); box-shadow: var(--shadow); position: relative; display: flex; align-items: center; justify-content: center; }
.dance-fab svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dance-fab .face { width: 40px; height: 40px; }
.dance-fab .lbl { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; background: var(--ink); color: #fff; border-radius: var(--r-full); padding: 1px 7px; }
.dance-fab.ready { animation: wiggle 2.4s ease-in-out infinite; }
@keyframes wiggle { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(-10deg); } 95% { transform: rotate(9deg); } }

.tabbar { display: flex; background: var(--canvas); border-top: 1px solid var(--hairline-soft); padding: 6px 4px calc(var(--safe-b) + 6px); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 11px; font-weight: 600; position: relative; transition: color .15s; }
.tabbar button.on { color: var(--ink); }
.tabbar button.on .nav-ic { color: #E88A00; }
.tabbar button:active .nav-ic { transform: scale(.88); }
.tabbar .dot { position: absolute; top: 2px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: var(--r-full); background: #E0505E; border: 2px solid var(--canvas); }

.avatar { position: relative; }
.avatar.syncing::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary); animation: spin .9s linear infinite; }
.avatar.offline::after { content: ''; position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--error); border: 2px solid var(--canvas); }
@keyframes spin { to { transform: rotate(360deg); } }
.sync-dot { position: absolute; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 60px); font-size: 12px; font-weight: 500; color: var(--muted);
  background: rgba(255,255,255,.9); border-radius: var(--r-full); padding: 2px 10px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; pointer-events: none; }
.sync-dot.show { opacity: 1; }

/* ---------- панели */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.0); transition: background .25s; display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap.open { background: rgba(0,0,0,.35); }
.sheet { width: 100%; max-width: 560px; max-height: 86vh; background: var(--canvas); border-radius: var(--r-lg) var(--r-lg) 0 0; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .32s var(--ease); padding-bottom: var(--safe-b); }
.sheet-wrap.open .sheet { transform: none; }
.sheet.peek { max-height: 70vh; }
.grab { width: 36px; height: 5px; border-radius: var(--r-full); background: var(--hairline); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; flex: none; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; letter-spacing: -.18px; }
.sheet-body { overflow-y: auto; padding: 0 16px 24px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sec { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
.sec:first-child { margin-top: 4px; }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 1.43; }
.tiny { font-size: 12px; line-height: 1.33; }
.good { color: var(--good); }
.bad { color: var(--error); }
.card { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px; margin-bottom: 12px; background: var(--canvas); }
.card.soft { background: var(--surface-soft); border-color: transparent; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.divider { height: 1px; background: var(--hairline-soft); margin: 16px 0; }
.cost { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.cost > span { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.cost .ic { width: 18px; height: 18px; }
.cost .lack { color: var(--error); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; line-height: 1.18; padding: 4px 10px; border-radius: var(--r-full); background: var(--canvas); box-shadow: var(--shadow); }
.badge.honey { background: var(--primary-soft); box-shadow: none; }
.badge.green { background: var(--good-soft); color: var(--good); box-shadow: none; }
.badge.gray { background: var(--surface-strong); box-shadow: none; color: var(--body); }

/* каталог построек */
.cats { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { height: 36px; padding: 0 14px; border-radius: var(--r-full); border: 1px solid var(--hairline); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bcard { text-align: left; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--hairline-soft); background: var(--canvas); display: flex; flex-direction: column; transition: transform .15s var(--ease); position: relative; }
.bcard:active { transform: scale(.97); }
.bcard .art { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; position: relative; }
.bcard .art .b-ic { width: 64%; height: 82%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.bcard .art .badge { position: absolute; left: 8px; top: 8px; }
.bcard .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.bcard .t { font-size: 15px; font-weight: 600; line-height: 1.25; }
.bcard .d { font-size: 13px; color: var(--muted); line-height: 1.3; flex: 1; }
.bcard .c { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
.bcard .c .tm { font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.bcard .c .tm .ui-ic { width: 14px; height: 14px; }
.bcard.poor .t, .bcard.poor .art { opacity: .55; }
.bcard.coach-target { box-shadow: 0 0 0 3px var(--primary); }

/* карточка здания */
.bhero { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.bhero .art { width: 88px; height: 88px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex: none; }
.bhero .art .b-ic { width: 72px; height: 72px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.bhero .lvl-line { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.bhero p { margin: 6px 0 0; font-size: 14px; color: var(--body); line-height: 1.43; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--hairline); }
.dots i.on { background: #E88A00; }
.amen { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--hairline-soft); }
.amen:last-child { border-bottom: 0; }
.amen .ai { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--surface-soft); display: flex; align-items: center; justify-content: center; flex: none; }
.amen .ai .ic, .amen .ai .ui-ic { width: 22px; height: 22px; }
.amen .at { font-size: 15px; line-height: 1.35; }
.amen .at small { display: block; font-size: 13px; color: var(--muted); }
.amen .delta { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--good); white-space: nowrap; }
.upg { border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px; margin-top: 16px; }
.upg .upg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.upg .upg-head b { font-size: 16px; font-weight: 600; }

<script>window.MEGAHIVE_API = "https://script.google.com/macros/s/AKfycbyt_fENruENHJPy5_j4VzFh9SdJVOVvbQJh9Cntz51dYeBFAtJM939JAvevX1WltKw/exec";</script>
<script>
window.Replica = (function () {
// ---- Actions.gs
/** Действия игрока с ульем: план строек, ярусы, пчёлы, танец. */

function getHive(ctx, hiveId) {
  if (!hiveId) return ctx.hives[0];
  for (var i = 0; i < ctx.hives.length; i++) if (ctx.hives[i].row.id === hiveId) return ctx.hives[i];
  throw gameErr('NO_HIVE');
}

function planCapacity(hd) { return brigades(hd) * getCfg().planSlotsPerBrigade; }

function cellReserved(hd, tier, idx) {
  if (cellAt(hd, tier, idx)) return true;
  var f = function (j) { return j.kind === 'new' && j.tier === tier && j.idx === idx; };
  return hd.jobs.some(f) || hd.plan.some(f);
}

function pendingUpgrades(hd, tier, idx) {
  var f = function (j) { return j.kind === 'upg' && j.tier === tier && j.idx === idx; };
  return hd.jobs.filter(f).length + hd.plan.filter(f).length;
}

/** Клиент может прислать свой id (cid), чтобы ссылаться на пункт до ответа сервера. */
function clientId(req, prefix) {
  var c = req && req.cid;
  return (typeof c === 'string' && /^c[a-z0-9]{6,24}$/.test(c)) ? c : uid(prefix);
}

function addToPlan(ctx, h, item, req) {
  var hd = h.hd;
  if (hd.plan.length >= planCapacity(hd)) throw gameErr('PLAN_FULL', { max: planCapacity(hd) });
  item.id = clientId(req, 'j');
  hd.plan.push(item);
  startPlanItems(ctx, NOW());
  if (hd.plan.some(function (p) { return p.id === item.id; })) ctx.pd.stats.planned++;
  return item.id;
}

function apiPlanNew(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var tier = Number(req.tier), idx = Number(req.idx), b = String(req.b);
  var def = cfg.buildings[b];
  if (!def) throw gameErr('BAD_BUILDING');
  if (def.tier !== tier) throw gameErr('WRONG_TIER');
  if ((def.lockedUntilStage || 0) > cfg.stage) throw gameErr('LOCKED_STAGE', { stage: def.lockedUntilStage });
  if (tier > hd.tiers) throw gameErr('TIER_CLOSED');
  if (!(idx >= 1 && idx <= 36)) throw gameErr('BAD_CELL');
  if (def.outerOnly && HEX[idx].ring !== 3) throw gameErr('OUTER_ONLY');
  if (cellReserved(hd, tier, idx)) throw gameErr('CELL_BUSY');
  return { id: addToPlan(ctx, h, { kind: 'new', tier: tier, idx: idx, b: b }, req) };
}

function apiPlanUpgrade(ctx, req) {
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var tier = Number(req.tier), idx = Number(req.idx);
  var c = cellAt(hd, tier, idx);
  var building = hd.jobs.filter(function (j) { return j.kind === 'new' && j.tier === tier && j.idx === idx; })[0];
  if (!c && !building) throw gameErr('NO_CELL');
  var lvl = c ? c.l : 1;
  if (lvl + pendingUpgrades(hd, tier, idx) >= 3) throw gameErr('MAX_LEVEL');
  return { id: addToPlan(ctx, h, { kind: 'upg', tier: tier, idx: idx, b: c ? c.b : building.b }, req) };
}

function apiPlanGate(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  if (hd.gate >= 3) throw gameErr('MAX_LEVEL');
  var pend = hd.jobs.concat(hd.plan).some(function (j) { return j.kind === 'gate'; });
  if (pend) throw gameErr('ALREADY_PLANNED');
  var need = cfg.gate[hd.gate + 1].needCells;
  if (countCells(hd, 1) < need) throw gameErr('NEED_CELLS', { n: need });
  return { id: addToPlan(ctx, h, { kind: 'gate' }, req) };
}

function apiPlanCancel(ctx, req) {
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var before = hd.plan.length;
  hd.plan = hd.plan.filter(function (p) { return p.id !== req.id; });
  if (hd.plan.length === before) throw gameErr('NOT_FOUND');
  // зависимые улучшения отменённой постройки тоже теряют смысл — их уберёт startPlanItems
  startPlanItems(ctx, NOW());
  return {};
}

function apiPlanMove(ctx, req) {
  var h = getHive(ctx, req.hiveId);
  var plan = h.hd.plan;
  var i = -1;
  for (var k = 0; k < plan.length; k++) if (plan[k].id === req.id) i = k;
  if (i < 0) throw gameErr('NOT_FOUND');
  var j = req.dir === 'up' ? i - 1 : i + 1;
  if (j < 0 || j >= plan.length) return {};
  var t = plan[i]; plan[i] = plan[j]; plan[j] = t;
  startPlanItems(ctx, NOW());
  return {};
}

function apiJobCancel(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var job = hd.jobs.filter(function (j) { return j.id === req.id; })[0];
  if (!job) throw gameErr('NOT_FOUND');
  // нельзя отменить постройку, если на неё запланированы улучшения в работе
  hd.jobs = hd.jobs.filter(function (j) { return j.id !== req.id; });
  for (var k in job.cost) ctx.pd.res[k] += Math.floor(job.cost[k] * cfg.refundOnCancel);
  if (job.kind === 'new') {
    hd.plan = hd.plan.filter(function (p) { return !(p.kind === 'upg' && p.tier === job.tier && p.idx === job.idx); });
  }
  startPlanItems(ctx, NOW());
  return {};
}

function apiUnlockTier(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  if (hd.tiers >= 2) throw gameErr('MAX_TIER'); // ярус 3 — этап 3
  if (countCells(hd, 1) < cfg.tier2.needCells) throw gameErr('NEED_CELLS', { n: cfg.tier2.needCells });
  var cost = cfg.tier2.cost;
  if (!canAfford(ctx.pd.res, cost)) throw gameErr('NO_RES', { need: missing(ctx.pd.res, cost) });
  pay(ctx.pd.res, cost);
  hd.tiers = 2;
  feedPush(ctx, 'tier2', {});
  startPlanItems(ctx, NOW());
  return {};
}

// ---------------------------------------------------------------- пчёлы
var ROLES = ['forager', 'crafter', 'nurse', 'lookout'];

function apiHatch(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var role = String(req.role), n = Math.floor(Number(req.n));
  if (ROLES.indexOf(role) < 0) throw gameErr('BAD_ROLE');
  if (!(n >= 1 && n <= 1000)) throw gameErr('BAD_AMOUNT');
  var prof = hiveProfile(hd);
  var room = prof.house - totalBees(hd) - queuedBees(hd);
  if (n > room) throw gameErr('NO_ROOM', { room: Math.max(0, room) });
  if (role === 'lookout') {
    var ql = hd.hatchQ.filter(function (q) { return q.role === 'lookout'; }).reduce(function (s, q) { return s + q.n; }, 0);
    if (hd.bees.lookout + ql + n > prof.lookoutCap) throw gameErr('LOOKOUT_CAP', { cap: prof.lookoutCap });
  }
  var cost = { honey: cfg.beeCost[role] * n };
  if (!canAfford(ctx.pd.res, cost)) throw gameErr('NO_RES', { need: missing(ctx.pd.res, cost) });
  pay(ctx.pd.res, cost);
  var last = hd.hatchQ[hd.hatchQ.length - 1];
  if (last && last.role === role) last.n += n;
  else hd.hatchQ.push({ role: role, n: n });
  return {};
}

function apiHatchCancel(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  hd.hatchQ.forEach(function (q) { ctx.pd.res.honey += cfg.beeCost[q.role] * q.n; });
  hd.hatchQ = [];
  hd.hatchProg = 0;
  return {};
}

function apiRetrain(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  var hd = h.hd;
  var from = String(req.from), to = String(req.to), n = Math.floor(Number(req.n));
  if (ROLES.indexOf(from) < 0 || ROLES.indexOf(to) < 0 || from === to) throw gameErr('BAD_ROLE');
  if (!(n >= 1)) throw gameErr('BAD_AMOUNT');
  var avail = hd.bees[from] - (hd.away[from] || 0);
  if (n > avail) throw gameErr('NOT_ENOUGH_BEES', { have: avail });
  if (to === 'lookout' && hd.bees.lookout + n > hiveProfile(hd).lookoutCap) {
    throw gameErr('LOOKOUT_CAP', { cap: hiveProfile(hd).lookoutCap });
  }
  // переобучение — только в Школе пчёл, с дневным лимитом по её уровню
  var limit = retrainLimit(hd);
  if (!limit) throw gameErr('NEED_SCHOOL');
  var day = dayKey(NOW());
  var rt = ctx.pd.retrain && ctx.pd.retrain.day === day ? ctx.pd.retrain : { day: day, n: 0 };
  if (rt.n + n > limit) throw gameErr('SCHOOL_LIMIT', { left: Math.max(0, limit - rt.n), limit: limit });
  var cost = { honey: cfg.retrainCost * n };
  if (!canAfford(ctx.pd.res, cost)) throw gameErr('NO_RES', { need: missing(ctx.pd.res, cost) });
  pay(ctx.pd.res, cost);
  hd.bees[from] -= n;
  hd.bees[to] += n;
  rt.n += n;
  ctx.pd.retrain = rt;
  return {};
}

/** Сколько пчёл в день можно переобучить в этом улье (сумма по Школам пчёл). */
function retrainLimit(hd) {
  var cfg = getCfg(), n = 0;
  eachCell(hd, function (t, i, c) { var d = cfg.buildings[c.b]; if (d && d.retrainDay) n += d.retrainDay[c.l - 1]; });
  return n;
}

function apiPropolisShare(ctx, req) {
  var cfg = getCfg();
  var h = getHive(ctx, req.hiveId);
  h.hd.pShare = clamp(Number(req.share) || 0, 0, cfg.maxPropolisShare);
  return {};
}

// ---------------------------------------------------------------- танец
function apiDance(ctx, req) {
  var cfg = getCfg();
  var now = NOW();
  var pd = ctx.pd;
  refreshEnergy(pd, now);
  if (pd.energy < cfg.danceCost) throw gameErr('NO_ENERGY');
  if (pd.buffs.some(function (b) { return b.type === 'gather' && b.until > now; })) throw gameErr('BUFF_ACTIVE');
  var acc = clamp(Number(req.accuracy) || 0, 0, 1);
  var q = clamp((acc - 0.5) / 0.5, 0, 1);
  var bonus = (cfg.danceMinBonus + (cfg.danceMaxBonus - cfg.danceMinBonus) * q) * modsAt(now, false).dance;
  if (pd.energy === cfg.energyMax) pd.energyTs = now;
  pd.energy -= cfg.danceCost;
  pd.buffs.push({ type: 'gather', bonus: round2(bonus), from: now, until: now + cfg.danceDurationSec * 1000 });
  pd.stats.dances++;
  return { bonus: round2(bonus) };
}

/**

function doGet(e) {

function api(json) {
  var req;

var PUBLIC_ACTIONS = {
  ping: function () { return { pong: true, version: getCfg().version, time: NOW() }; },
  colors: function () { return apiColors(); },
  register: function (req) { return apiRegister(req); },
  login: function (req) { return apiLogin(req); }
};

  state: function () { return {}; },

  planUpgrade: apiPlanUpgrade,
  planGate: apiPlanGate,
  planCancel: apiPlanCancel,
  planMove: apiPlanMove,
  jobCancel: apiJobCancel,
  unlockTier: apiUnlockTier,
  hatch: apiHatch,
  hatchCancel: apiHatchCancel,
  retrain: apiRetrain,
  propolisShare: apiPropolisShare,
  dance: apiDance,
  expSend: apiExpeditionSend,
  expPreview: apiExpeditionPreview,
  expChoose: apiExpeditionChoose,

  dailyClaim: apiDailyClaim,
  dailyChest: apiDailyChest,
  loginClaim: apiLoginClaim,
  collectDrop: apiCollectDrop,
  goalClaim: apiGoalClaim,
  gift: apiGift,
  sting: apiSting,
  swarms: apiSwarms,
  leaderboard: function () { return apiLeaderboard(); },
  setLang: function (ctx, req) { ctx.player.lang = req.lang === 'en' ? 'en' : 'ru'; return {}; },
  logout: function (ctx) { ctx.player.token = ''; return {}; }
}; }

function handle(req) {
  _tables = {};
  _cfgCache = null;
  _mapGrid = null;
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
  } catch (e) {
    return { ok: false, code: 'BUSY' };
  }
  try {
    var action = String(req.action || '');
    if (PUBLIC_ACTIONS[action]) return { ok: true, result: PUBLIC_ACTIONS[action](req) };
    var ACTIONS = getActions();
    if (action !== 'batch' && !ACTIONS[action]) throw gameErr('BAD_ACTION');
    var player = authPlayer(req.token);
    var ctx = loadCtx(player);
    var now = NOW();
    ensureEventObjects(now);
    advance(ctx, now);
    processInbox(ctx);
    refreshEnergy(ctx.pd, now);
    dropsRefresh(ctx.pd, now);
    ensureGoal(ctx, now);
    touchLogin(ctx, now);
    ensureDaily(ctx, now);
    revealVision(ctx);
    var out = { ok: true };
    if (action === 'batch') {
      // пачка отложенных действий клиента: каждое выполняется отдельно, ошибка одного не мешает другим
      out.results = (req.ops || []).slice(0, 50).map(function (op) {
        try {
          var fn = op && ACTIONS[op.action];
          if (!fn || op.action === 'batch') throw gameErr('BAD_ACTION');
          op.token = req.token;
          return { ok: true, result: fn(ctx, op) || {} };
        } catch (e) {
          if (e && e.isGame) return { ok: false, code: e.code, params: e.params };
          return { ok: false, code: 'SERVER', message: String(e && e.message || e) };
        }
      });
      revealVision(ctx);
    } else {
      out.result = ACTIONS[action](ctx, req) || {};
    }
    // новый клиент считает всё сам по «снимку»; старому отдаём готовое состояние
    if (req.snap) out.snap = snapshot(ctx, now);
    else out.state = stateView(ctx, now);
    ctx.pd.notices = [];
    saveCtx(ctx);
    return out;
  } catch (e) {
    if (e && e.isGame) return { ok: false, code: e.code, params: e.params };
    return { ok: false, code: 'SERVER', message: String(e && e.message || e), stack: String(e && e.stack || '') };
  } finally {
    lock.releaseLock();
  }
}

/** Сырые данные игрока для копии игровой логики на телефоне. */
function snapshot(ctx, now) {
  return {
    now: now,
    player: { id: ctx.player.id, name: ctx.player.name, color: ctx.player.color, lang: ctx.player.lang,
              character: ctx.player.character, telegram: ctx.player.telegram, createdAt: Number(ctx.player.createdAt) },
    pd: JSON.parse(JSON.stringify(ctx.pd)),
    hives: ctx.hives.map(function (h) {
      return { row: { id: h.row.id, x: Number(h.row.x), y: Number(h.row.y), main: Number(h.row.main), radius: Number(h.row.radius) },
               hd: JSON.parse(JSON.stringify(h.hd)), land: h.land, landSeason: h.landSeason };
    }),
    round: roundInfo(),
    cfg: getCfg()
  };
}

function loadCtx(player) {
  var hives = dbFilter('Hives', 'ownerId', player.id).sort(function (a, b) { return Number(b.main) - Number(a.main); });
  if (!hives.length) throw gameErr('NO_HIVE');
  var ctx = {
    player: player,
    pd: parseJson(player.data, null),
    hives: hives.map(function (row) { return { row: row, hd: parseJson(row.data, null), land: null }; })
  };
  var t = Number(ctx.pd.lastTs) || NOW();
  ctx.hives.forEach(function (h) { refreshLand(ctx, h, t); });
  return ctx;
}

function saveCtx(ctx) {
  ctx.player.data = JSON.stringify(ctx.pd);
  ctx.player.glory = computeGlory(ctx);
  dbUpdate('Players', ctx.player);
  ctx.hives.forEach(function (h) {
    h.row.data = JSON.stringify(h.hd);
    h.row.radius = getCfg().gate[h.hd.gate].radius;
    dbUpdate('Hives', h.row);
  });
}

function revealVision(ctx) {
  ctx.hives.forEach(function (h) {
    ctx.pd.fog = fogReveal(ctx.pd.fog, Number(h.row.x), Number(h.row.y), hiveVision(h.hd));
  });
}

function apiLeaderboard() {
  return {
    players: dbTable('Players').map(function (p) {
      return { name: p.name, color: p.color, glory: Number(p.glory) || 0 };
    }).sort(function (a, b) { return b.glory - a.glory; })

function stateView(ctx, now) {
  var cfg = getCfg();
  var pd = ctx.pd;
  var fl = computeFlows(ctx, now);
  var rates = { nectar: 0, honey: 0, wax: 0, propolis: 0, jelly: 0 };
  var waxPaused = pd.res.wax >= cfg.autopauseAt * fl.caps.wp;
  var hives = ctx.hives.map(function (h, i) {
    var f = fl.hives[i];
    var hd = h.hd;
    var nhUse = Math.min(f.nhIn, f.gN + (pd.res.nectar > 1 ? f.nhIn : 0));
    rates.nectar += f.gN - nhUse;
    rates.honey += (f.nhIn ? nhUse * f.nhOut / f.nhIn : 0) - (waxPaused ? 0 : f.hwIn) - f.upkeep;
    rates.wax += waxPaused ? 0 : f.hwOut;
    rates.propolis += f.gP - f.heat;
    rates.jelly += f.jelly;
    var cells = [];
    eachCell(hd, function (tier, idx, c) {
      var d = cfg.buildings[c.b];
      cells.push({ tier: tier, idx: idx, b: c.b, l: c.l, adj: round2(adjFactor(hd, tier, idx, c.b)) });
    });
    var plan = hd.plan.map(function (p, k) {
      var ready = planItemReady(hd, p);
      var pc = ready === 'drop' ? null : planItemCost(hd, p, now);
      return { id: p.id, kind: p.kind, tier: p.tier, idx: p.idx, b: p.b, ready: ready,
               cost: pc && pc.cost, sec: pc && pc.sec, missing: pc ? missing(pd.res, pc.cost) : {} };
    });
    return {
      id: h.row.id, x: Number(h.row.x), y: Number(h.row.y), main: !!Number(h.row.main),
      gate: hd.gate, tiers: hd.tiers, cells: cells, jobs: hd.jobs, plan: plan,
      brigades: brigades(hd), planCap: planCapacity(hd),
      k: { 1: newCellK(hd, 1), 2: newCellK(hd, 2), 3: newCellK(hd, 3) },
      count: { 1: countCells(hd, 1), 2: countCells(hd, 2) },
      bees: hd.bees, away: hd.away, hatchQ: hd.hatchQ, hatchRate: round2(f.hatch || f.prof.hatch * f.nfill),
      pShare: hd.pShare,
      prof: { house: f.prof.house, craftSlots: f.prof.craftSlots, nurseSlots: f.prof.nurseSlots,
              lookoutCap: f.prof.lookoutCap, vision: hiveVision(hd) },
      flows: { gN: round2(f.gN), gP: round2(f.gP), nhIn: round2(f.nhIn), nhOut: round2(f.nhOut),
               hwIn: round2(f.hwIn), hwOut: round2(f.hwOut), upkeep: round2(f.upkeep), wfill: round2(f.wfill), nfill: round2(f.nfill) },
      land: { nectar: round2(h.land.nectar), propolis: round2(h.land.propolis), cells: h.land.cells,
              shared: h.land.shared, spring: h.land.spring, radius: cfg.gate[hd.gate].radius }
    };
  });
  for (var k in rates) rates[k] = round2(rates[k]);
  var lang = ctx.player.lang;
  return {
    serverTime: now,
    player: { id: ctx.player.id, name: ctx.player.name, color: ctx.player.color, lang: lang,
              character: ctx.player.character, telegram: ctx.player.telegram, createdAt: Number(ctx.player.createdAt) },
    res: pd.res, caps: fl.caps, rates: rates, waxPaused: waxPaused, hungry: pd.res.honey <= 0,
    cocoonUntil: Number(ctx.player.createdAt) + cfg.cocoonHours * HOUR,
    energy: pd.energy, energyTs: pd.energyTs, buffs: pd.buffs,
    seasonCostMult: seasonCostMult(now),
    hives: hives,
    season: seasonForecast(now),
    tutorial: tutorialView(ctx),
    goal: goalView(ctx),
    drops: dropsView(pd, now),
    daily: dailyView(ctx),
    login: pd.login,
    exps: pd.exps.map(function (e) {
      return { id: e.id, x: e.x, y: e.y, lookouts: e.lookouts, foragers: e.foragers, depart: e.depart,
               arrive: e.arrive, back: e.back || null, deadline: e.deadline || null, status: e.status,
               loot: e.status === 'out' ? null : e.loot, lost: e.lost, found: e.found || null,
               event: e.event ? expEventView(e, lang) : null };
    }),
    reports: pd.reports.map(function (r) {
      var out = JSON.parse(JSON.stringify(r));
      if (r.event) out.event = expEventView(r, lang);
      return out;
    }),
    notices: pd.notices || [],
    stats: pd.stats,
    glory: computeGlory(ctx),
    cfg: clientCfg()
  };
}

// ---- Auth.gs
/** Регистрация и вход по имени и ПИН-коду. */

var PLAYER_COLORS = ['#f2b134', '#e4572e', '#29b6f6', '#66bb6a', '#ab47bc', '#ff7043',
                     '#26a69a', '#ec407a', '#8d6e63', '#5c6bc0', '#d4e157', '#78909c'];
var CHARACTERS = ['toiler', 'warrior', 'wanderer'];

function hashPin(pin, salt) {
  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + ':' + pin, Utilities.Charset.UTF_8);
  return bytes.map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');
}

function newToken() {
  return Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
}

function validateName(name) {
  name = String(name || '').trim().replace(/\s+/g, ' ');
  if (name.length < 3 || name.length > 16) throw gameErr('NAME_LENGTH');
  if (!/^[\p{L}\p{N}_ \-]+$/u.test(name)) throw gameErr('NAME_CHARS');
  return name;
}

function validatePin(pin) {
  pin = String(pin || '');
  if (!/^\d{4}$/.test(pin)) throw gameErr('PIN_FORMAT');
  return pin;
}

function apiRegister(req) {
  var cfg = getCfg();
  var name = validateName(req.name);
  var pin = validatePin(req.pin);
  if (dbFind('Players', 'nameLower', name.toLowerCase())) throw gameErr('NAME_TAKEN');
  var color = String(req.color || '');
  if (PLAYER_COLORS.indexOf(color) < 0) throw gameErr('BAD_COLOR');
  var used = dbTable('Players').map(function (p) { return p.color; });
  if (used.indexOf(color) >= 0) throw gameErr('COLOR_TAKEN');
  var tg = String(req.telegram || '').trim();
  if (tg) {
    if (!/^@?[A-Za-z0-9_]{5,32}$/.test(tg)) throw gameErr('BAD_TELEGRAM');
    if (tg.charAt(0) !== '@') tg = '@' + tg;
  }
  var lang = req.lang === 'en' ? 'en' : 'ru';
  var character = CHARACTERS.indexOf(req.character) >= 0 ? req.character : 'toiler';

  var pos = pickStartPosition();
  if (!pos) throw gameErr('MAP_FULL');

  var now = NOW();
  var salt = Utilities.getUuid();
  var token = newToken();
  var player = {
    id: uid('p'), name: name, nameLower: name.toLowerCase(),
    pinHash: hashPin(pin, salt), salt: salt, color: color, telegram: tg, lang: lang,
    character: character, createdAt: now, token: token,
    tokenExp: now + cfg.tokenDays * DAY, fails: 0, lockUntil: 0, glory: 0,
    data: JSON.stringify(newPlayerData(now))
  };
  dbInsert('Players', player);
  var hive = {
    id: uid('h'), ownerId: player.id, x: pos.x, y: pos.y, main: 1,
    radius: cfg.gate[1].radius, data: JSON.stringify(newHiveData(now))
  };
  dbInsert('Hives', hive);
  feedPush({ player: player }, 'join', {});
  return { token: token };
}

function apiLogin(req) {
  var cfg = getCfg();
  var name = String(req.name || '').trim().replace(/\s+/g, ' ');
  var p = dbFind('Players', 'nameLower', name.toLowerCase());
  if (!p) throw gameErr('BAD_LOGIN');
  var now = NOW();
  if (Number(p.lockUntil) > now) {
    throw gameErr('LOCKED', { minutes: Math.ceil((Number(p.lockUntil) - now) / 60000) });
  }
  if (hashPin(String(req.pin || ''), p.salt) !== p.pinHash) {
    p.fails = Number(p.fails || 0) + 1;
    if (p.fails >= cfg.pinMaxFails) {
      p.fails = 0;
      p.lockUntil = now + cfg.pinLockMin * 60000;
    }
    dbUpdate('Players', p);
    throw gameErr('BAD_LOGIN');
  }
  p.fails = 0;
  p.lockUntil = 0;
  p.token = newToken();
  p.tokenExp = now + cfg.tokenDays * DAY;
  dbUpdate('Players', p);
  return { token: p.token };
}

/** Находит игрока по токену. */
function authPlayer(token) {
  if (!token) throw gameErr('AUTH');
  var p = dbFind('Players', 'token', token);
  if (!p || Number(p.tokenExp) < NOW()) throw gameErr('AUTH');
  return p;
}

function apiColors() {
  var used = dbTable('Players').map(function (p) { return p.color; });
  return { colors: PLAYER_COLORS.map(function (c) { return { color: c, free: used.indexOf(c) < 0 }; }) };
}

var _cfgCache = null;

/** Конфиг с учётом переопределений из листа Config (кэшируется на время выполнения). */
function getCfg() {
  if (_cfgCache) return _cfgCache;
  var cfg = JSON.parse(JSON.stringify(CFG_BASE));
  cfg.buildings = JSON.parse(JSON.stringify(BUILDINGS_BASE));
  try {
    var rows = dbReadAll('Config');
    for (var i = 0; i < rows.length; i++) {
      var path = String(rows[i][0] || '').trim();
      if (!path || path.charAt(0) === '#') continue;
      var val;
      try { val = JSON.parse(rows[i][1]); } catch (e) { val = rows[i][1]; }
      setByPath(cfg, path, val);
    }
  } catch (e) { /* листа нет — используем базу */ }
  _cfgCache = cfg;
  return cfg;
}

function setByPath(obj, path, val) {
  var parts = path.split('.');
  var o = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] === undefined || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = val;
}

// ---- Db.gs
/**
 * Доступ к Google Таблице. Каждый лист — таблица с заголовками в первой строке.
 * За одно выполнение лист читается один раз (кэш), запись — построчно.
 */
var SHEETS = {
  Players: ['id', 'name', 'nameLower', 'pinHash', 'salt', 'color', 'telegram', 'lang', 'character',
            'createdAt', 'token', 'tokenExp', 'fails', 'lockUntil', 'glory', 'data'],
  Hives: ['id', 'ownerId', 'x', 'y', 'main', 'radius', 'data'],
  Map_Objects: ['id', 'x', 'y', 'type', 'data'],
  Round: ['key', 'value'],
  Config: ['path', 'value', 'comment'],
  Events_Queue: ['id', 'type', 'startTs', 'endTs', 'fromId', 'toId', 'data', 'status'],
  Hall_of_Fame: ['round', 'place', 'name', 'glory', 'title'],
  Feed: ['id', 'ts', 'pid', 'name', 'color', 'type', 'to', 'data']
};

var _ss = null;
var _tables = {};

function getSS() {
  if (_ss) return _ss;
  var id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');
  _ss = id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet();
  return _ss;
}

function dbSheet(name) {
  var sh = getSS().getSheetByName(name);
  if (!sh) throw gameErr('NO_SHEET', { name: name });
  return sh;
}

/** Все строки данных (без заголовка) как массивы. */
function dbReadAll(name) {
  var sh = dbSheet(name);
  var last = sh.getLastRow();
  if (last < 2) return [];
  return sh.getRange(2, 1, last - 1, sh.getLastColumn()).getValues();
}

/** Таблица как массив объектов. Объект знает свой номер строки (_row). */
function dbTable(name) {
  if (_tables[name]) return _tables[name];
  var headers = SHEETS[name];
  var rows = dbReadAll(name);
  var list = [];
  for (var i = 0; i < rows.length; i++) {
    var o = { _row: i + 2 };
    for (var c = 0; c < headers.length; c++) o[headers[c]] = rows[i][c];
    list.push(o);
  }
  _tables[name] = list;
  return list;
}

function dbFind(name, field, value) {
  var t = dbTable(name);
  for (var i = 0; i < t.length; i++) if (String(t[i][field]) === String(value)) return t[i];
  return null;
}

function dbFilter(name, field, value) {
  return dbTable(name).filter(function (o) { return String(o[field]) === String(value); });
}

function rowValues(name, obj) {
  return SHEETS[name].map(function (h) {
    var v = obj[h];
    if (v === undefined || v === null) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return v;
  });
}

function dbInsert(name, obj) {
  var sh = dbSheet(name);
  sh.appendRow(rowValues(name, obj));
  obj._row = sh.getLastRow();
  if (_tables[name]) _tables[name].push(obj);
  return obj;
}

function dbUpdate(name, obj) {
  if (!obj._row) throw new Error('dbUpdate without _row');
  var vals = rowValues(name, obj);
  dbSheet(name).getRange(obj._row, 1, 1, vals.length).setValues([vals]);
}

function parseJson(s, def) {
  if (s === '' || s === null || s === undefined) return def;
  if (typeof s === 'object') return s;
  try { return JSON.parse(s); } catch (e) { return def; }
}

// ---------------------------------------------------------------- Round
function roundGet(key, def) {
  var row = dbFind('Round', 'key', key);
  return row ? parseJson(row.value, def) : def;
}

function roundSet(key, value) {
  var row = dbFind('Round', 'key', key);
  if (row) { row.value = JSON.stringify(value); dbUpdate('Round', row); }
  else dbInsert('Round', { key: key, value: JSON.stringify(value) });
}

function getMapGrid() {
  if (_mapGrid) return _mapGrid; // в памяти: каждый CacheService.get — это сетевой вызов (~десятки мс)
  var cache = CacheService.getScriptCache();
  var s = cache.get('mapgrid');
  if (s) { _mapGrid = s; return s; }
  var sh = getSS().getSheetByName('World_Map');
  var vals = sh.getRange(1, 1, getCfg().mapSize, getCfg().mapSize).getValues();
  s = vals.map(function (r) { return r.join(''); }).join('');
  try { cache.put('mapgrid', s, 21600); } catch (e) { /* кэш необязателен */ }
  _mapGrid = s;
  return s;
}

function terrainAt(x, y) {
  var n = getCfg().mapSize;
  if (x < 0 || y < 0 || x >= n || y >= n) return 'R';
  return getMapGrid().charAt(y * n + x);
}

function newHiveData(now) {

    hatchQ: [], hatchProg: 0,
    jobs: [], plan: [],
    pShare: cfg.defaultPropolisShare
  };
